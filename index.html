<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報理論 練習 — 文章題・選択題・計算題</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2d3d; --sub:#5b6b7d;
    --accent:#1F4E79; --accent2:#2E74B5; --ok:#1f8a5b; --okbg:#e6f6ee;
    --ng:#c0392b; --ngbg:#fdecea; --line:#e2e8f0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
  header{text-align:center;padding:14px 0 6px}
  header h1{margin:0;font-size:22px;color:var(--accent)}
  header p{margin:4px 0 0;font-size:13px;color:var(--sub)}
  .tabs{display:flex;gap:8px;margin:16px 0 10px}
  .tab{flex:1;padding:12px 8px;border:none;border-radius:12px;background:#e7eef7;color:var(--accent);
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .tab small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:2px}
  .tab.active{background:var(--accent);color:#fff}
  .tab.active small{color:#dbe7f5}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
  .bar .prog{font-size:13px;color:var(--sub);flex:1}
  .bar .prog b{color:var(--accent);font-size:15px}
  .btn{padding:9px 14px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-line{background:#fff;border:1.5px solid var(--accent2);color:var(--accent2)}
  .btn-accent{background:var(--accent2);color:#fff}
  .btn-sm{padding:7px 12px;font-size:13px}
  .card{background:var(--card);border-radius:16px;padding:20px 18px;box-shadow:0 2px 14px rgba(31,78,121,.08);
    border:1px solid var(--line)}
  .qno{font-size:12px;color:var(--sub);letter-spacing:.05em}
  .src{font-size:12px;color:var(--accent2);font-weight:700;margin-top:2px}
  .qtext{font-size:19px;font-weight:600;margin:10px 0 4px;white-space:pre-wrap}
  .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent2);color:var(--accent2);
    text-align:center;font-weight:700;padding:0 8px}
  .ctx{font-size:14px;color:var(--sub);margin-top:8px;white-space:pre-wrap;border-left:3px solid var(--line);padding-left:10px}
  .ex{font-size:13.5px;color:#8A6D3B;background:#FFF8E8;border:1px solid #EBD9A8;border-radius:10px;
    padding:9px 12px;margin-top:10px;line-height:1.65}
  .ex b{color:#7A5A1E}
  .qnum{display:inline-block;background:#eef3f9;color:var(--accent);font-weight:800;font-size:13px;
    border-radius:7px;padding:2px 9px;margin-right:8px;vertical-align:2px}
  .ans{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--okbg);border:1px solid #b9e6cf;display:none}
  .ans.show{display:block}
  .ans .lab{font-size:12px;color:var(--ok);font-weight:700}
  .ans .val{font-size:19px;font-weight:800;color:var(--ok);margin-top:2px}
  .inrow{display:flex;gap:8px;margin-top:14px}
  .inrow input{flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
  .inrow input:focus{outline:none;border-color:var(--accent2)}
  .feedback{margin-top:8px;font-size:14px;font-weight:700;min-height:20px}
  .feedback.ok{color:var(--ok)}
  .feedback.ng{color:var(--ng)}
  .opts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
    font-size:15px;cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--accent2)}
  .opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
  .opt.wrong{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
  .opt.disabled{pointer-events:none}
  .nav{display:flex;gap:8px;margin-top:16px}
  .nav .btn{flex:1}
  .done{text-align:center;padding:30px 16px}
  .done .big{font-size:40px;font-weight:800;color:var(--accent)}
  .done p{color:var(--sub)}
  .rowbtns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .hidebtn{background:none;border:none;color:var(--accent2);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .given{background:#F7FAFD;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
  .given table{border-collapse:collapse;margin-top:6px;width:100%}
  .given th,.given td{border:1px solid #cfd9e4;padding:5px 8px;text-align:center;font-size:14px}
  .given th{background:#eef3f9}
  .given code{font-size:15px}
  .fld{margin-top:12px}
  .fld label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .fld input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
  .fld input:focus{outline:none;border-color:var(--accent2)}
  .fld .mk{margin-left:8px;font-weight:800}
  .sol{margin-top:14px;padding:13px 15px;border-radius:12px;background:#FFFBF0;border:1px solid #E8D5A8;display:none}
  .sol.show{display:block}
  .sol h4{margin:0 0 6px;font-size:14px;color:#7A6033}
  .sol .stp{font-size:14.5px;line-height:1.85;color:#4a4a4a}
  .sol .fin{font-weight:800;color:var(--ng);font-size:16px}
  .hint{font-size:12.5px;color:var(--sub);margin-top:4px}
  .bline{font-size:16.5px;line-height:2.5;margin:2px 0;display:flex;flex-wrap:wrap;align-items:baseline}
  .bline.plainl{color:var(--sub);font-size:15px;padding-left:34px;line-height:1.9}
  .bline.subl{padding-left:34px}
  .lno{display:inline-block;min-width:26px;font-weight:800;color:var(--accent);flex:none}
  .btxt{flex:1;min-width:0}
  input.bi{display:inline-block;border:none;border-bottom:2px solid var(--accent2);background:#F5F9FD;
    border-radius:5px 5px 0 0;font-size:16px;font-weight:700;color:var(--accent);
    padding:2px 8px;margin:0 3px;text-align:center;font-family:inherit}
  input.bi:focus{outline:none;background:#E9F2FB}
  input.bi.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
  input.bi.ng{border-color:var(--ng);color:var(--ng);background:var(--ngbg)}
  .refl{font-size:12.5px;color:var(--sub);margin:0 0 6px 34px;line-height:1.55}
  .refl b{color:var(--accent2)}
  .exl{font-size:12.5px;color:#8A6D3B;background:#FFF8E8;border-left:3px solid #E8C86A;
    border-radius:0 8px 8px 0;padding:5px 10px;margin:2px 0 8px 34px;line-height:1.6;display:none}
  .exl.show{display:block}
  .setttl{font-size:17px;font-weight:800;color:#7A6033;background:#FFFBF0;border:1px solid #E8D5A8;
    border-radius:10px;padding:9px 13px;margin-bottom:12px}
  .sc{font-size:13px;color:var(--sub);margin-top:10px}
  .seg{display:inline-flex;border:1.5px solid var(--accent2);border-radius:999px;overflow:hidden}
  .seg button{border:none;background:#fff;color:var(--accent2);font-size:12.5px;font-weight:700;
    padding:6px 13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent2);color:#fff}
  .why{margin-top:9px;padding:10px 13px;border-radius:10px;background:#F3F8FC;
    border-left:4px solid var(--accent2);font-size:14px;line-height:1.75;color:#2a3b4d;display:none}
  .why.show{display:block}
  .why b{color:var(--accent)}
  .why .wq{font-size:12.5px;color:var(--sub);display:block;margin-bottom:3px}
  .whyl{margin:2px 0 10px 34px;padding:8px 12px;border-radius:0 10px 10px 0;background:#F3F8FC;
    border-left:4px solid var(--accent2);font-size:13.5px;line-height:1.7;color:#2a3b4d;display:none}
  .whyl.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>情報理論 練習</h1>
    <p>文章題（穴埋め）・選択題・計算題</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabA" onclick="switchMode('bunsho')">文章題<small>穴埋め</small></button>
    <button class="tab" id="tabB" onclick="switchMode('sentaku')">選択題<small>定理・キーワード</small></button>
    <button class="tab" id="tabC" onclick="switchMode('keisan')">計算題<small>毎回 数値が変わる</small></button>
  </div>

  <div class="bar">
    <div class="prog">第 <b id="cur">1</b> / <span id="total">0</span> <span id="unit">問</span>
      <span id="scorewrap" style="display:none">　正解 <b id="score" style="color:var(--ok)">0</b></span>
    </div>
    <span style="font-size:12px;color:var(--sub)">解説</span><span id="segWrap"></span>
    <button class="btn btn-line btn-sm" id="btnShuf" onclick="shuffleNow()">🔀 順番を打ち乱す</button>
    <button class="btn btn-line btn-sm" id="btnRe" onclick="restart()">↻ 最初から</button>
  </div>

  <div id="stage"></div>
</div>

<script>
/* =========================================================
   題庫：練習問題.docx の原文どおり（太字下線＝解答）
   t: 原文（___ が空欄）  a: 解答  alt: 許容表記  src: 出典
   ctx: 同じ設問の他の行（文脈）
   ========================================================= */
const BSETS = [
{src:"練習問題(第一回)", lines:[
  {no:"1", t:"1948年(___)が論文発表", a:[{v:"シャノン",alt:["シャナン","shannon"],e1:"1948年に情報理論を創始した人（C. E. Shannon）。",e2:"論文「A Mathematical Theory of Communication」で情報量・エントロピーを定義し、情報源符号化定理と通信路符号化定理の2つを示した。この科目全体の出発点。"}]},
  {no:"",  t:"ア)で(___)な符号化する", a:[{v:"効率的",alt:[],e1:"むだを削る方向。＝情報源符号化（第4章）の目的。",e2:"平均符号長 L をエントロピー H に近づけること。高頻度の記号を短い符号語にする。もう一方の「信頼性」とは逆方向（あちらは冗長を足す）。"}]},
  {no:"",  t:"イ）で(___)の高い符号化をする。", a:[{v:"信頼性",alt:[],e1:"誤りに強くする方向。＝通信路符号化（第6章）の目的。",e2:"検査ビットを加えて誤りを検出・訂正できるようにする。冗長を「足す」ので効率とは逆。R=k/n が下がる代わりに誤りに強くなる。"}]},
]},

{src:"練習問題(第二回)", lines:[
  {no:"1", t:"情報量は(___)の関数", a:[{v:"確率",alt:[],e1:"情報量は確率だけで決まる。I(P) = -log P。",e2:"I は確率 P の関数。P が小さい（めずらしい）ほど I は大きい。エントロピーが最大になるのも「確率が等しい」ときで、やはり確率で決まる。"}]},
  {plain:"I(P) = log（1/P）= -logP[ビット]"},
  {no:"2", t:"確率が大きくなると、情報量は(___)なる", a:[{v:"小さく",alt:["小さい"],e1:"P が大きいほど -log P は小さい。",e2:"P=1 なら I=-log1=0。当たり前のことが起きても情報はゼロ。逆に P が 0 に近いほど I は大きくなる。"}]},
]},

{src:"練習問題2(第三回)", lines:[
  {no:"1", t:"エントロピーは事象の(___)の期待値", a:[{v:"情報量",alt:[],e1:"H = -ΣP log P は、各事象の情報量 I=-log P の期待値。",e2:"「期待値」なので確率で重み付けして足す。単なる合計ではない点に注意（練習問題2(第5回)5. と同じ論点）。"}]},
  {plain:"H(A) = - P1 logP1 – P2logP2....-Pjlog Pj"},
  {no:"2", t:"事象系の(___)を表す", a:[{v:"不確実さ",alt:[],e1:"エントロピーは「結果がどれだけ読めないか」の尺度。",e2:"0 ≦ H ≦ log n。結果が決まっていれば H=0、等確率のとき H=log n で最大。H(A|B) は B を知ってもなお残る A の不確実さ。"}]},
  {no:"3", t:"(___)の値が(___)なるとき最大となる", a:[{v:"確率",alt:[],e1:"情報量は確率だけで決まる。I(P) = -log P。",e2:"I は確率 P の関数。P が小さい（めずらしい）ほど I は大きい。エントロピーが最大になるのも「確率が等しい」ときで、やはり確率で決まる。"},{v:"等しく",alt:["等しい"],e1:"等確率のとき H = log n で最大になる。",e2:"偏りがあるほど予測しやすくなり H は下がる。逆にどれも同じ確率だといちばん読めない＝最大。"}]},
]},

{src:"練習問題3(第4回)", lines:[
  {no:"1", t:"確率分布なら(___)計算可能", a:[{v:"エントロピー",alt:[],e1:"確率分布さえあれば H = -ΣP log P が計算できる。",e2:"平均符号長 L の下限でもある（情報源符号化定理 L ≧ H）。第2章の中心概念で、③の計算題はこれ。"}]},
  {no:"2", t:"結合確率なら(___)でH(A,B)と表す", a:[{v:"結合エントロピー",alt:[],e1:"2つの事象系をまとめた不確実さ H(A,B)。",e2:"H(A,B) = -ΣΣ P(aᵢ,bⱼ) log P(aᵢ,bⱼ)。連鎖則 H(A,B) = H(A) + H(B|A) が成り立つ。"}]},
  {no:"3", t:"条件付き確率なら(___)でH(A|B)", a:[{v:"条件付きエントロピー",alt:[],e1:"B を知った後に残る A の不確実さ H(A|B)。",e2:"H(A|B) = Σⱼ P(bⱼ)H(A|bⱼ)。まず各 bⱼ ごとに H(A|bⱼ) を出し、P(bⱼ) で重み付けして足す。必ず H(A|B) ≦ H(A)。"}]},
  {no:"4", t:"H(A|B)はBを知って依然残るAの(___)", a:[{v:"不確実さ",alt:[],e1:"H(A|B) は B を知ってもなお残る A の不確実さ。",e2:"B から情報を得た分だけ減っており、H(A|B) ≦ H(A)。減った差 H(A)-H(A|B) が相互情報量。"}]},
]},

{src:"練習問題2(第5回)", lines:[
  {no:"1", t:"事象の数が増加すれば不確実さは(___)する", a:[{v:"増加",alt:[],e1:"選択肢が増えれば読みにくくなる。",e2:"最大値 log n の n が増えるので上限そのものが上がる。例：2択なら最大1bit、4択なら最大2bit。"}]},
  {no:"2", t:"他の事象の情報が得られれば不確実さは(___)する", a:[{v:"減少",alt:[],e1:"情報を得れば不確実さは減る。",e2:"式で書くと H(A|B) ≦ H(A)。減った分がちょうど相互情報量 I(A;B) = H(A) - H(A|B)（第5章）。"}]},
  {no:"3", t:"情報の発生元を(___)という", a:[{v:"情報源",alt:[],e1:"記号を次々に発生させるもと。",e2:"記号の集合と確率で表す。生起が独立なら無記憶情報源、依存性があればマルコフ情報源。"}]},
  {no:"4", t:"記号の生起が独立である 3. を(___)という", a:[{v:"無記憶情報源",alt:["無記憶"],e1:"各記号が互いに独立に出る情報源。",e2:"前に何が出たかに影響されない。n次拡大すると H(Sⁿ) = n·H(S) がちょうど成り立つ（マルコフではこうならない）。"}],
    ref:"「3.」＝ 3. の解答", ex:"3.＝情報源 →「記号の生起が独立である情報源を…」"},
  {no:"5", t:"3. は総和でなく(___)つまりエントロピーで評価", a:[{v:"期待値",alt:[],e1:"エントロピーは総和ではなく、確率で重み付けした平均。",e2:"H = ΣPᵢ·(その事象の情報量) という形。ここを「総和」と勘違いしないよう問題文がわざわざ念を押している。"}],
    ref:"「3.」＝ 3. の解答", ex:"3.＝情報源 →「情報源は総和でなく…」"},
  {no:"6", t:"n個組み合わせた 3. を(___)という", a:[{v:"n次拡大",alt:["ｎ次拡大","n次拡張"],e1:"n個の記号をひとまとめにした情報源 Sⁿ。",e2:"無記憶なら H(Sⁿ)=n·H(S)。情報源符号化定理の証明で使い、1記号あたりの平均符号長を H に近づける役割をする。"}],
    ref:"「3.」＝ 3. の解答", ex:"3.＝情報源 →「n個組み合わせた情報源を…」"},
]},

{src:"練習問題2（マルコフ情報源）", lines:[
  {no:"1", t:"(___)情報源は記号間の生起に依存性がある", a:[{v:"マルコフ",alt:[],e1:"記号間の生起に依存性がある情報源。",e2:"いまの状態によって次の記号の確率が変わる。無記憶情報源との対比で覚える。エントロピーは定常分布で重み付けして求める。"}]},
  {no:"2", t:"1. の記号の生起は状態の(___)を考える必要がある", a:[{v:"遷移",alt:[],e1:"いまの状態から次の状態へ移ること。",e2:"状態遷移図と遷移確率で表す。マルコフ情報源では記号の生起を「状態の遷移」として捉えるのがポイント。"}],
    ref:"「1.」＝ 1. の解答", ex:"1.＝マルコフ情報源 →「マルコフ情報源の記号の生起は…」"},
  {no:"3", t:"まず、平衡方程式より(___)を求める", a:[{v:"定常分布",alt:[],e1:"平衡方程式を解いて得る、各状態に居る確率。",e2:"w = wP と Σw=1 を連立して解く。マルコフ情報源のエントロピーを求める4ステップの2番目。"}]},
  {no:"4", t:"次に, 各(___)のエントロピーを求める", a:[{v:"状態",alt:[],e1:"各状態ごとにエントロピーを計算する。",e2:"状態 i でのエントロピー Hᵢ = -Σ P(記号|状態i) log P(記号|状態i)。最後に定常分布 wᵢ で重み付けする。"}]},
  {no:"5", t:"3 と 4 より(___)のエントロピー求める。", a:[{v:"マルコフ情報源",alt:[],e1:"定常分布と各状態のエントロピーから H = Σ wᵢHᵢ。",e2:"4ステップ：①状態遷移図 ②平衡方程式→定常分布 ③各状態のエントロピー ④定常分布で重み付け。"}],
    ref:"「3 と 4」＝ 3. と 4. の内容", ex:"3＝定常分布、4＝各状態のエントロピー"},
]},

{src:"練習問題（情報源の符号化について答えよ）", lines:[
  {plain:"・情報源の符号化について答えよ"},
  {no:"1", t:"(___)な符号化を目的とする", a:[{v:"効率的",alt:[],e1:"むだを削る方向。＝情報源符号化（第4章）の目的。",e2:"平均符号長 L をエントロピー H に近づけること。高頻度の記号を短い符号語にする。もう一方の「信頼性」とは逆方向（あちらは冗長を足す）。"}]},
  {no:"2", t:"情報源記号を(___)にすることである", a:[{v:"符号語",alt:[],e1:"情報源記号に割り当てる 0/1 の列。",e2:"情報源符号化とは「記号 → 符号語」の対応をつくること。どんな符号語を割り当てるかで平均符号長が変わる。"}]},

/* ===== 状態 ===== */
let mode='bunsho', order=[], idx=0, score=0, answered=false;
let expMode='kantan';
try{ const v=localStorage.getItem('joho_exp'); if(v) expMode=v; }catch(e){}
function setExp(m){ expMode=m; try{localStorage.setItem('joho_exp',m)}catch(e){}
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===expMode));
  if(mode==='keisan'){ const sb=document.getElementById('solBody');
    if(sb&&calcQ) sb.innerHTML=(expMode==='kantan'&&calcQ.brief)?calcQ.brief():calcQ.sol(); }
  document.querySelectorAll('[data-e1]').forEach(el=>{
    el.innerHTML = el.getAttribute(expMode==='kantan'?'data-e1':'data-e2'); });
}
function segHTML(){ return `<span class="seg">
  <button data-m="kantan" class="${expMode==='kantan'?'on':''}" onclick="setExp('kantan')">かんたん</button>
  <button data-m="kuwashii" class="${expMode==='kuwashii'?'on':''}" onclick="setExp('kuwashii')">くわしい</button></span>`; }
function expOf(o){ const t=(expMode==='kantan')?o.e1:o.e2; return t||o.e1||''; }
function pool(){ return mode==='bunsho'?BSETS:SENTAKU; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildOrder(){ order = (mode==='sentaku') ? selPool() : [...pool().keys()]; }
function switchMode(m){
  if(mode===m) return;
  mode=m; idx=0; score=0; answered=false; optMap=null;
  document.getElementById('tabA').classList.toggle('active',m==='bunsho');
  document.getElementById('tabB').classList.toggle('active',m==='sentaku');
  document.getElementById('tabC').classList.toggle('active',m==='keisan');
  document.getElementById('scorewrap').style.display=(m==='sentaku')?'inline':'none';
  const isK=(m==='keisan');

/* =========================================================
   計算題モジュール（毎回 数値が変わる）
   ========================================================= */
function gg(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function F(n,d){d=(d===undefined)?1:d; if(d<0){n=-n;d=-d} const k=gg(n,d); return {n:n/k,d:d/k}}
function Fadd(a,b){return F(a.n*b.d+b.n*a.d,a.d*b.d)}
function Fmul(a,b){return F(a.n*b.n,a.d*b.d)}
function Fz(a){return a.n===0}
function Fs(a){return a.d===1?String(a.n):a.n+"/"+a.d}
function Fv(a){return a.n/a.d}
function S0(){return {c:F(0),L:{}}}
function Sadd(x,y){const r={c:Fadd(x.c,y.c),L:Object.assign({},x.L)};
  for(const p in y.L) r.L[p]=r.L[p]?Fadd(r.L[p],y.L[p]):y.L[p]; return r}
function Smul(x,k){const r={c:Fmul(x.c,k),L:{}};for(const p in x.L)r.L[p]=Fmul(x.L[p],k);return r}
function logInt(n){const r=S0();let m=n;
  for(const p of [2,3,5,7,11,13]){while(m%p===0){m/=p;
    if(p===2)r.c=Fadd(r.c,F(1)); else r.L[p]=r.L[p]?Fadd(r.L[p],F(1)):F(1);}}
  return r}
function Sstr(x){
  const t=[];
  if(!Fz(x.c))t.push({neg:x.c.n<0,s:Fs(F(Math.abs(x.c.n),x.c.d))});
  for(const p of Object.keys(x.L).map(Number).sort((a,b)=>a-b)){
    const co=x.L[p]; if(Fz(co))continue;
    const ab=F(Math.abs(co.n),co.d);
    t.push({neg:co.n<0,s:(ab.n===1&&ab.d===1)?("log"+p):("("+Fs(ab)+")log"+p)});
  }
  if(!t.length)return "0";
  const fi=t.findIndex(v=>!v.neg); if(fi>0)t.unshift(t.splice(fi,1)[0]);
  let out=(t[0].neg?"-":"")+t[0].s;
  for(let i=1;i<t.length;i++)out+=(t[i].neg?" - ":" + ")+t[i].s;
  return out;
}
function Sval(x){let v=Fv(x.c);for(const p in x.L)v+=Fv(x.L[p])*Math.log2(Number(p));return v}
function entropyS(cnt){const N=cnt.reduce((a,b)=>a+b,0);let x=logInt(N);
  for(const n of cnt)x=Sadd(x,Smul(logInt(n),F(-n,N)));return x}
function infoS(n,N){return Sadd(logInt(N),Smul(logInt(n),F(-1)))}
function evalExpr(s){
  if(!s)return NaN;
  s=String(s).replace(/[　\s]/g,'').replace(/[（]/g,'(').replace(/[）]/g,')')
   .replace(/[×・*]/g,'*').replace(/[÷]/g,'/').replace(/bit|ビット/gi,'')
   .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
   .replace(/log₂/g,'log').replace(/log_?2(?=[^0-9]|$)/g,'log');
  if(/[^0-9+\-*/().logLOG]/.test(s))return NaN;
  s=s.replace(/log(\d+)/gi,'L($1)');
  s=s.replace(/(\d|\))\s*L\(/g,'$1*L(');
  s=s.replace(/\)\s*\(/g,')*(').replace(/(\d)\s*\(/g,'$1*(');
  try{const v=new Function('L','return ('+s+')')(x=>Math.log2(x)); return (typeof v==='number'&&isFinite(v))?v:NaN}catch(e){return NaN}
}
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- ③ 情報量とエントロピー ---------- */
function genEntropy(){
  const NICE=[[8,[1,2,3,4,5,6]],[10,[1,2,3,4,5,6]],[16,[1,2,3,4,5,6,8,9,10]],[12,[1,2,3,4,5,6,8,9]]];
  let N,pool,cnt;
  for(let g=0;g<300;g++){
    [N,pool]=pick(NICE);
    const k=RI(3,4); cnt=[]; let rest=N;
    let ok=true;
    for(let i=0;i<k-1;i++){
      const cand=pool.filter(v=>v<=rest-(k-1-i));
      if(!cand.length){ok=false;break}
      const v=pick(cand); cnt.push(v); rest-=v;
    }
    if(!ok)continue;
    cnt.push(rest);
    if(cnt.some(v=>v<1)||!pool.includes(rest))continue;
    const s=entropyS(cnt);
    // log3 か log5 が残る「ちょうどよい」問題に限定
    if(Object.keys(s.L).length===0)continue;
    if(Object.keys(s.L).some(p=>Number(p)>7))continue;
    break;
  }
  const N2=cnt.reduce((a,b)=>a+b,0);
  const names=["s1","s2","s3","s4","s5"].slice(0,cnt.length);
  const target=RI(0,cnt.length-1);
  const Hs=entropyS(cnt), Is=infoS(cnt[target],N2);
  const rows=cnt.map((v,i)=>`<tr><td>${names[i]}</td><td>${v}/${N2}</td></tr>`).join('');
  return {
    kind:"③ 情報量とエントロピー",
    given:`<div class="given">無記憶情報源 S の確率分布：
      <table><tr><th>記号</th><th>確率</th></tr>${rows}</table></div>`,
    ask:`次を求めよ（log の底は 2、答えは log のままでよい）`,
    fields:[
      {label:`(1) 記号 ${names[target]} の情報量 I`, ans:Sval(Is), disp:Sstr(Is)+" (bit)", ph:"例: 3-log3"},
      {label:`(2) エントロピー H(S)`, ans:Sval(Hs), disp:Sstr(Hs)+" (bit)", ph:"例: 5/2-(3/8)log3"}
    ],
    brief:()=>`<div class="stp">
      <b>使う式</b>： I = -log P　／　H = -Σ P log P<br>
      (1) I(${names[target]}) = -log(${cnt[target]}/${N2}) = <span class="fin">${Sstr(Is)}</span><br>
      (2) H(S) = <span class="fin">${Sstr(Hs)}</span></div>`,
    sol:()=>{
      const st=cnt.map((v,i)=>`　I(${names[i]}) = -log(${v}/${N2}) = <b>${Sstr(infoS(v,N2))}</b>`).join('<br>');
      const terms=cnt.map(v=>`-(${v}/${N2})log(${v}/${N2})`).join(' ');
      return `<div class="stp">
        <b>(1) 情報量</b> I = -log P<br>${st}<br><br>
        <b>(2) エントロピー</b> H = -Σ P log P<br>
        　H = ${terms}<br>
        　　= log${N2} - (1/${N2})[ ${cnt.map(v=>v+"·log"+v).join(' + ')} ]<br>
        　　= <span class="fin">${Sstr(Hs)} (bit)</span></div>`;
    }
  };
}

/* ---------- ② ハフマン符号 ---------- */
function genHuffman(){
  let vals;
  for(let g=0;g<200;g++){
    const k=pick([4,4,5]);
    vals=[]; let rest=100;
    for(let i=0;i<k-1;i++){const v=RI(5,Math.max(5,Math.floor(rest-(k-1-i)*5)-5));vals.push(v);rest-=v}
    vals.push(rest);
    if(vals.some(v=>v<5||v>60))continue;
    if(new Set(vals).size<k-1)continue;
    break;
  }
  const names=["s1","s2","s3","s4","s5"].slice(0,vals.length);
  const items=names.map((s,i)=>({s,p:vals[i]/100}));
  // ハフマン（手順記録つき）
  let nodes=items.map(o=>({p:o.p,leaf:o.s,code:{}}));
  nodes.forEach(n=>{n.set=[n.leaf]});
  const steps=[]; let work=nodes.map(n=>({p:n.p,set:[n.leaf]}));
  const codes={}; names.forEach(s=>codes[s]="");
  while(work.length>1){
    work.sort((a,b)=>a.p-b.p||a.set.join().localeCompare(b.set.join()));
    const lo=work.shift(), hi=work.shift();
    lo.set.forEach(s=>codes[s]="0"+codes[s]);
    hi.set.forEach(s=>codes[s]="1"+codes[s]);
    steps.push(`最小の2つ ${lo.set.join("+")}(${lo.p.toFixed(2)}) と ${hi.set.join("+")}(${hi.p.toFixed(2)}) を結合 → ${(lo.p+hi.p).toFixed(2)}`);
    work.push({p:lo.p+hi.p,set:lo.set.concat(hi.set)});
  }
  const L=items.reduce((a,o)=>a+o.p*codes[o.s].length,0);
  const rows=items.map(o=>`<tr><td>${o.s}</td><td>${o.p.toFixed(2)}</td></tr>`).join('');
  const rows2=items.map(o=>`<tr><td>${o.s}</td><td>${o.p.toFixed(2)}</td><td><code>${codes[o.s]}</code></td><td>${codes[o.s].length}</td><td>${(o.p*codes[o.s].length).toFixed(2)}</td></tr>`).join('');
  return {
    kind:"② ハフマン符号",
    given:`<div class="given">情報源 S の確率：
      <table><tr><th>記号</th><th>確率</th></tr>${rows}</table></div>`,
    ask:`ハフマン符号を作り、平均符号長 L を求めよ。（結合と並べ換えの手順も紙に書くこと）`,
    fields:[{label:"平均符号長 L", ans:Number(L.toFixed(10)), disp:L.toFixed(2)+" bit", ph:"例: 1.85"}],
    brief:()=>`<div class="stp"><b>使う式</b>： L = Σ Pᵢlᵢ（最小の2つを結合していく）<br>
      符号長： ${items.map(o=>o.s+"="+codes[o.s].length).join("、")}<br>
      L = <span class="fin">${L.toFixed(2)} bit</span></div>`,
    sol:()=>`<div class="stp"><b>結合の手順</b><br>${steps.map((s,i)=>`　${i+1}. ${s}`).join('<br>')}<br><br>
      <b>符号語と符号長</b>
      <table style="width:100%;border-collapse:collapse;margin-top:6px">
      <tr><th>記号</th><th>確率</th><th>符号語</th><th>長さ</th><th>P·l</th></tr>${rows2}</table>
      <br>L = ${items.map(o=>o.p.toFixed(2)+"×"+codes[o.s].length).join(" + ")} = <span class="fin">${L.toFixed(2)} bit</span>
      <br><span class="hint">※ 0/1 の割り当ては流儀により違ってよい。符号長の組が同じなら L は同じ。</span></div>`
  };
}

/* ---------- ④ ハミング符号と訂正 ---------- */
function hd(a,b){let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d}
function genHamming(){
  const n=pick([5,6,7]);
  let C,dmin,r,near;
  for(let g=0;g<500;g++){
    C=[Array(n).fill(0)];
    for(let i=0;i<2;i++)C.push(Array.from({length:n},()=>RI(0,1)));
    const ds=[hd(C[0],C[1]),hd(C[0],C[2]),hd(C[1],C[2])];
    dmin=Math.min(...ds);
    if(dmin<3||dmin>n-1)continue;
    // 受信語：ある符号語を t ビット反転（一意に最近になるもの）
    const base=RI(0,2); r=C[base].slice();
    const t=Math.floor((dmin-1)/2);
    const flips=[]; while(flips.length<Math.max(1,t)){const q=RI(0,n-1);if(!flips.includes(q))flips.push(q)}
    flips.forEach(q=>r[q]=1-r[q]);
    const dd=C.map(c=>hd(r,c)); const mn=Math.min(...dd);
    if(dd.filter(x=>x===mn).length!==1)continue;
    near=dd.indexOf(mn); break;
  }
  const bs=a=>"("+a.join(",")+")";
  const d01=hd(C[0],C[1]),d02=hd(C[0],C[2]),d12=hd(C[1],C[2]);
  const tD=dmin-1, tC=Math.floor((dmin-1)/2);
  return {
    kind:"④ ハミング符号と訂正",
    given:`<div class="given">符号 C = {C1, C2, C3}<br>
      　C1 = <code>${bs(C[0])}</code><br>　C2 = <code>${bs(C[1])}</code><br>　C3 = <code>${bs(C[2])}</code><br>
      　受信語 b = <code>${bs(r)}</code></div>`,
    ask:`次を求めよ`,
    fields:[
      {label:"(1) 最小距離 dmin", ans:dmin, disp:String(dmin), ph:"整数"},
      {label:"(2) 誤り検出可能なビット数", ans:tD, disp:tD+" bit", ph:"整数"},
      {label:"(3) 誤り訂正可能なビット数", ans:tC, disp:tC+" bit", ph:"整数"},
      {label:"(4) 受信語 b はどれに復号されるか（1/2/3 で答える）", ans:near+1, disp:"C"+(near+1), ph:"1 か 2 か 3"}
    ],
    brief:()=>`<div class="stp">
      <b>使う式</b>： 検出 dmin ≧ t'+1　／　訂正 dmin ≧ 2t+1　／　復号は最も近い符号語<br>
      dmin = <span class="fin">${dmin}</span>、検出 <span class="fin">${tD}bit</span>、訂正 <span class="fin">${tC}bit</span>、復号先 <span class="fin">C${near+1}</span></div>`,
    sol:()=>`<div class="stp">
      <b>(1)</b> dH(C1,C2)=${d01}、dH(C1,C3)=${d02}、dH(C2,C3)=${d12} → dmin = <span class="fin">${dmin}</span><br><br>
      <b>(2)</b> dmin ≧ t'+1 → ${dmin} ≧ t'+1 → t' ≦ ${tD}　∴ <span class="fin">${tD} bit</span><br><br>
      <b>(3)</b> dmin ≧ 2t+1 → ${dmin} ≧ 2t+1 → t ≦ ${((dmin-1)/2).toFixed(1)}　∴ <span class="fin">${tC} bit</span><br><br>
      <b>(4)</b> dH(b,C1)=${hd(r,C[0])}、dH(b,C2)=${hd(r,C[1])}、dH(b,C3)=${hd(r,C[2])}
      → 最も近い <span class="fin">C${near+1}</span> に復号</div>`
  };
}

/* ---------- ⑤ 線形符号 ---------- */
function genLinear(){
  const k=pick([2,2,3]), m=k===2?3:4, n=k+m;
  let P;
  for(let g=0;g<300;g++){
    P=[]; // k×m : P[i][j] = 情報ビット i が検査ビット j に寄与するか
    for(let i=0;i<k;i++)P.push(Array.from({length:m},()=>RI(0,1)));
    const colOK=Array.from({length:m},(_,j)=>P.some(r=>r[j]===1));
    const rowOK=P.every(r=>r.some(v=>v===1));
    const cols=Array.from({length:m},(_,j)=>P.map(r=>r[j]).join(''));
    if(colOK.every(Boolean)&&rowOK&&new Set(cols).size===m)break;
  }
  const iv=Array.from({length:k},()=>RI(0,1));
  const par=j=>P.reduce((a,r,i)=>(a+r[j]*iv[i])%2,0);
  const cw=iv.concat(Array.from({length:m},(_,j)=>par(j)));
  const iN=Array.from({length:k},(_,i)=>"i"+(i+1));
  const pN=Array.from({length:m},(_,j)=>"P"+(j+1));
  const eqs=pN.map((p,j)=>{
    const t=iN.filter((_,i)=>P[i][j]===1);
    return `${p} = ${t.join(" + ")}`;
  });
  const G=Array.from({length:k},(_,i)=>
    Array.from({length:k},(_,t)=>t===i?1:0).concat(P[i]));
  const H=Array.from({length:m},(_,j)=>
    Array.from({length:k},(_,i)=>P[i][j]).concat(Array.from({length:m},(_,t)=>t===j?1:0)));
  const mat=M=>`<table style="width:auto;margin-top:4px">${M.map(r=>`<tr>${r.map(v=>`<td style="padding:3px 9px">${v}</td>`).join('')}</tr>`).join('')}</table>`;
  return {
    kind:"⑤ 線形符号",
    given:`<div class="given">情報ビット ${k} 個、符号長 ${n}。符号語 = [${iN.join(", ")}, ${pN.join(", ")}]<br>
      検査式：<br>　${eqs.join("<br>　")}<br><br>
      情報ビット [${iv.join(", ")}] を符号化せよ。</div>`,
    ask:`次を求めよ（すべて mod 2）`,
    fields:[{label:`符号語（${n}桁、例: ${Array(n).fill(0).join("")}）`, ans:cw.join(''), str:true,
             alt:[cw.join(','),cw.join(', '),"["+cw.join(',')+"]"], disp:"["+cw.join(", ")+"]", ph:cw.map(()=>"_").join("")}],
    brief:()=>`<div class="stp">
      <b>やること</b>： 情報ビットを検査式に代入（mod 2）して検査ビットを求め、後ろに並べる<br>
      符号語 = <span class="fin">[${cw.join(", ")}]</span></div>`,
    sol:()=>`<div class="stp">
      <b>検査ビットを計算</b><br>
      ${pN.map((p,j)=>{const t=iN.filter((_,i)=>P[i][j]===1);
        const vs=iN.map((_,i)=>P[i][j]===1?iv[i]:null).filter(v=>v!==null);
        return `　${p} = ${t.join(" + ")} = ${vs.join(" + ")} = ${par(j)}`;}).join("<br>")}
      <br><br><b>符号語</b> = <span class="fin">[${cw.join(", ")}]</span><br><br>
      <b>生成行列 G = [ I | P ]</b>${mat(G)}
      <b>検査行列 H = [ Pᵀ | I ]</b>${mat(H)}
      <span class="hint">※ H·(符号語)ᵀ = 0 で検算できる。</span></div>`
  };
}

const GENS={ "3":genEntropy, "2":genHuffman, "4":genHamming, "5":genLinear };
let calcType="all", calcQ=null, calcDone=false;
function newCalc(){
  const keys = calcType==="all" ? ["2","3","4","5"] : [calcType];
  calcQ = GENS[pick(keys)]();
  calcDone=false; render();
}
function setCalcType(t){ calcType=t; newCalc(); }
function viewKeisan(){
  if(!calcQ) calcQ=GENS[pick(["2","3","4","5"])]();
  const q=calcQ;
  const chips=[["all","すべて"],["2","② ハフマン"],["3","③ エントロピー"],["4","④ ハミング"],["5","⑤ 線形符号"]]
    .map(([v,l])=>`<button class="chip ${calcType===v?'on':''}" onclick="setCalcType('${v}')">${l}</button>`).join('');
  const flds=q.fields.map((f,i)=>`<div class="fld">
      <label>${f.label}<span class="mk" id="mk${i}"></span></label>
      <input id="cf${i}" type="text" placeholder="${f.ph||''}" autocomplete="off"
        onkeydown="if(event.key==='Enter')checkCalc()">
    </div>`).join('');
  return `<div class="chips">${chips}</div>
   <div class="card">
    <div class="qno">計算題 · ${esc(q.kind)}</div>
    <div class="qtext" style="font-size:17px">${q.ask}</div>
    ${q.given}
    ${flds}
    <div class="feedback" id="fb"></div>
    <div class="inrow" style="margin-top:14px">
      <button class="btn btn-accent" style="flex:1" onclick="checkCalc()">判定</button>
      <button class="btn btn-line" style="flex:1" onclick="showCalcSol()">解答・解説</button>
    </div>
    <div class="sol" id="sol"><h4>解答と手順</h4>
      <div id="solBody">${expMode==='kantan'&&q.brief?q.brief():q.sol()}</div></div>
    <div class="nav"><button class="btn btn-accent" style="flex:1" onclick="newCalc()">🎲 新しい数値で出題</button></div>
   </div>`;
}
function checkCalc(){
  const q=calcQ; let allok=true, any=false;
  q.fields.forEach((f,i)=>{
    const raw=document.getElementById('cf'+i).value.trim();
    const mk=document.getElementById('mk'+i);
    if(!raw){ mk.textContent=''; allok=false; return }
    any=true; let ok;
    if(f.str){
      const nz=s=>String(s).replace(/[\s,\[\]　]/g,'');
      ok = nz(raw)===nz(f.ans) || (f.alt||[]).some(a=>nz(raw)===nz(a));
    } else {
      const v=evalExpr(raw);
      ok = isFinite(v) && Math.abs(v-f.ans)<1e-6;
    }
    mk.textContent = ok?'◯':'✕';
    mk.style.color = ok?'var(--ok)':'var(--ng)';
    if(!ok)allok=false;
  });
  const fb=document.getElementById('fb');
  if(!any){ fb.textContent='答えを入力してください'; fb.className='feedback ng'; return }
  if(allok){ fb.textContent='◯ 全問正解！'; fb.className='feedback ok'; }
  else { fb.textContent='✕ ちがう項目があります（解答・解説で確認）'; fb.className='feedback ng'; }
  showCalcSol();
}
function showCalcSol(){
  const sb=document.getElementById('solBody');
  if(sb) sb.innerHTML = (expMode==='kantan'&&calcQ.brief)?calcQ.brief():calcQ.sol();
  document.getElementById('sol').classList.add('show');
  calcQ.fields.forEach((f,i)=>{
    const mk=document.getElementById('mk'+i);
    if(!mk.textContent) mk.innerHTML=`<span style="color:var(--sub);font-weight:600;font-size:13px">→ ${f.disp}</span>`;
  });
}

buildOrder(); render();
