<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ＩＴ戦略とマネジメントの基礎 — 期末模拟测验</title>
<style>
:root{
 --bg:#f4f6f9; --fg:#1c2430; --muted:#66707f; --card:#fff; --card2:#fbfcfe;
 --line:#dde3ea; --accent:#2f6fed; --accent-fg:#fff;
 --ghost-bg:#eef2f8; --ghost-fg:#2f4a7a;
 --tag-bg:#eef2f8; --tag-fg:#4a6a9a; --hot-bg:#ffeaea; --hot-fg:#b03030;
 --sel-bg:#eaf1ff; --ok-bd:#1f9d55; --ok-bg:#e8f7ee; --no-bd:#d64545; --no-bg:#fdeaea;
 --exp-bg:#f7f9fc; --shadow:rgba(0,0,0,.05); --figbg:#fff; --warn:#a33;
 color-scheme:light;
}
html[data-theme="dark"]{
 --bg:#11151b; --fg:#e4e9f0; --muted:#95a2b6; --card:#1a2028; --card2:#202832;
 --line:#2d3641; --accent:#5590ff; --accent-fg:#0c1016;
 --ghost-bg:#242c37; --ghost-fg:#a9bdd9;
 --tag-bg:#242c37; --tag-fg:#9db4d4; --hot-bg:#3b2127; --hot-fg:#ff9d9d;
 --sel-bg:#1d3052; --ok-bd:#41c47c; --ok-bg:#152f20; --no-bd:#e26c6c; --no-bg:#331b1e;
 --exp-bg:#19202a; --shadow:rgba(0,0,0,.45); --figbg:#e9edf2; --warn:#ff9090;
 color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:24px 12px;line-height:1.75;transition:background .18s,color .18s}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.bar{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;z-index:5;box-shadow:0 2px 6px var(--shadow)}
.bar b{font-size:18px}
button{font:inherit;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
button.ghost{background:var(--ghost-bg);color:var(--ghost-fg)}
button.on{outline:2px solid var(--accent);outline-offset:-2px}
#themeBtn{margin-left:auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;background:var(--tag-bg);color:var(--tag-fg);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.tag.hot{background:var(--hot-bg);color:var(--hot-fg)}
.qt{font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;background:var(--card2);transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--sel-bg)}
.opt.ok{border-color:var(--ok-bd);background:var(--ok-bg)}
.opt.no{border-color:var(--no-bd);background:var(--no-bg)}
.exp{margin-top:11px;padding:11px 14px;background:var(--exp-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:14px;display:none}
.exp.show{display:block}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;display:none}
.res.show{display:block}
.fig{margin:10px 0;padding:10px;background:var(--figbg);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.fig img{max-width:100%;display:block}
.opt.oi{display:flex;align-items:center;gap:10px}
.opt.oi .ol{font-weight:700;color:var(--tag-fg);min-width:16px}
.opt.oi img{max-width:200px;background:var(--figbg);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>ＩＴ戦略とマネジメントの基礎（小野）— 期末模拟测验</h1>
<div class="sub">全 14 回 ｜ 67 题（小テスト全13回を完全収録＋図表つき 7 題）｜ <b style="color:var(--warn)">持ち込み不可</b> — 全部暗記が必要。8割は小テストの再出題<br>🔥 = 課題テストとITパスポート過去問で<b>重複出題</b>された論点（最頻出）／🔴 = 前回間違えた問題</div>

<div class="bar">
  <b id="score">0 / 0</b>
  <span id="prog" style="color:var(--muted)">未作答</span>
  <button id="shufBtn" onclick="doShuffle()">🔀 シャッフル</button>
  <button id="origBtn" class="ghost on" onclick="noShuffle()">↩ 元の順番</button>
  <span id="shufNote" style="color:var(--muted);font-size:12.5px"></span>
  <button onclick="grade()">批改并看解析</button>
  <button id="themeBtn" class="ghost" onclick="toggleTheme()">🌙 ダーク</button>
  <button class="ghost" onclick="reset()">ReDo</button>
</div>


<div class="res" id="res"></div>
<div id="quiz"></div>

{c:"第02回 企業活動",t:"企業の経営理念を明確にする効果として、最も適切なものはどれか。",o:["企業の経営目標を達成するためのシナリオを明確にすることができる","企業の経営戦略を実現するための計画を具体的にすることができる","企業の存在意義や価値観を明確にすることができる","企業の到達したい将来像を示すことができる"],a:2,e:"経営理念＝その企業が「何のために存在するのか」という存在意義・価値観。シナリオや計画は経営戦略、将来像はビジョン。（第02回 問1）"},
{c:"第02回 企業活動",t:"小売業A社は、自社の物流センター近隣の小学校で、社会の一般的な物流プロセスを分かりやすく紹介する活動を行っている。この活動の背景にある考えはどれか。",o:["アライアンス","CSR","コアコンピタンス","コーポレートガバナンス"],a:1,e:"CSR＝企業の社会的責任。地域社会への貢献活動が典型例。"},
{c:"第02回 企業活動",t:"企業経営に関わる役職の一つである CFO が責任をもつ対象はどれか。",o:["情報","財務","人事","技術"],a:1,e:"CFO=Chief Financial Officer（最高財務責任者）。CEO=経営／COO=執行／CIO=情報／CTO=技術。"},
{c:"第02回 企業活動",t:"大規模災害による建物の倒壊を想定したBCPとして、最も適切なものはどれか。",o:["被災時に顧客からの問合せに迅速対応するため、社員を待機させる手順を整備する","被災時にも事業を継続するため、機能を代替する拠点を確保し、重要な業務に絞って実施手順を整備する","毎年の予算に建物の保険を組み込み、同規模の建物への移転に備える","被災後の火災による被害を防ぐため、カーテンなどを不燃素材に取り替える"],a:1,e:"BCP＝事業継続計画。「事業を止めない」ための代替手段の確保が本質。保険や防火は BCP ではない。"},
{c:"第02回 企業活動",t:"プロジェクト組織を説明したものはどれか。",o:["製品や機能などの単位を組み合わせ、縦と横の構造をもつ組織","製品・地域などを単位として、事業の利益責任をもつ組織","業務を専門的な機能に分け、機能を単位として構成する組織","ある問題を解決するために必要な機能だけを集めて一定期間に限って結成し、問題解決とともに解散する組織"],a:3,e:"a=マトリックス組織／b=事業部制組織／c=職能別組織／d=プロジェクト組織。"},

{c:"第03回 財務",t:"資本活用の効率性を示す指標はどれか。",o:["売上高営業利益率","総資本回転率","自己資本比率","損益分岐点比率"],a:1,e:"回転率＝効率性。利益率＝収益性。自己資本比率＝安全性。"},
{c:"第03回 財務",t:"粗利益を求める計算式はどれか。",o:["(経常利益)＋(特別利益)－(特別損失)","(税引前当期純利益)－(法人税等)","(営業利益)＋(営業外収益)－(営業外費用)","(売上高)－(売上原価)"],a:3,e:"粗利益＝売上総利益＝売上高－売上原価。c は経常利益の式。"},
{c:"第03回 財務",img:"03-Q3",t:"あるメーカーの当期損益の見込みは表のとおりであったが，その後広告宣伝費が5億円，保有株式の受取配当金が3億円増加した。このとき，最終的な営業利益と経常利益はそれぞれ何億円になるか。ここで，広告宣伝費，保有株式の受取配当金以外は全て見込みどおりであったものとする。",o:["営業利益85億円　経常利益93億円","営業利益85億円　経常利益92億円","営業利益220億円　経常利益92億円","営業利益220億円　経常利益93億円"],a:1,e:"売上総利益＝1,000−780＝220 ／ 営業利益＝220−130＝90 → 広告宣伝費+5 で 85億円。経常利益＝85＋(営業外収益20＋受取配当金3)−営業外費用16＝92億円。選択肢の220は売上総利益（引っかけ）。（第03回 問3）"},
{c:"第03回 財務",img:"03-Q4",t:"ある商品を表の条件で販売したとき，損益分岐点売上高は何円か。",o:["250,000","150,000","300,000","200,000"],a:1,e:"変動費率＝100/300＝1/3。損益分岐点売上高＝固定費÷(1−変動費率)＝100,000÷(2/3)＝150,000円。（第03回 問4）"},
{c:"第03回 財務",img:null,oimg:["03-Q5_0","03-Q5_1","03-Q5_2","03-Q5_3"],t:"企業の財務状況を明らかにするための貸借対照表の記載形式として，適切なものはどれか。",o:["a","b","c","d"],a:0,e:"貸借対照表は左（借方）＝資産の部、右（貸方）＝負債の部＋純資産の部。左右の合計は必ず一致する。（第03回 問5）"},
{c:"🔥財務",t:"損益計算書「だけ」から計算できる経営指標はどれか。",o:["売上高増加率","売上高利益率","自己資本利益率(ROE)","すべて計算できる"],a:1,e:"売上高増加率は前期の数値が、ROEは貸借対照表の自己資本が必要。（ITパスポート令和6 問30）"},

{c:"第04回 法務",t:"意匠権による保護の対象として適切なものはどれか。",o:["工芸家がデザインし職人が量産できる、土産物の張子の虎","山の斜面に作られた棚田の景観","プリント基板の回路そのもの","業務用車両に描かれたサービスの名称"],a:0,e:"意匠権＝物品のデザイン（外観）。回路配置は回路配置利用権、名称は商標権。"},
{c:"第04回 法務",t:"サイバーセキュリティ基本法に規定されているものだけを全て挙げたものはどれか。\na. 国や地方公共団体が果たすべき責務\nb. 国民が努力すべきこと\nc. 施策の推進についての基本理念",o:["a, b, c","b, c","a, b","a, c"],a:0,e:"3つとも規定されている。"},
{c:"第04回 法務",t:"パスワードに関連した不適切な行為a〜dのうち、不正アクセス禁止法で規制されている行為だけを全て挙げたものはどれか。\na. 業務を代行してもらうために、社内DBアクセス用の自分のIDとパスワードを同僚に伝えた\nb. 自分のPCに、社内DBアクセス用の自分のパスワードのメモを貼り付けた\nc. 電子メールに添付されていた文書の閲覧用パスワードを、見る権利のない人に教えた\nd. 人気のショッピングサイトに登録されている他人のIDとパスワードを、無断で第三者に伝えた",o:["a，c，d","d","a，b，c，d","a，d"],a:3,e:"不正アクセス禁止法が規制するのは「他人の」ID・パスワードの不正取得／提供／保管など。a は自分のIDを第三者に伝える＝不正アクセス助長行為で規制対象、d も他人のIDの無断提供で対象。b は自分のメモなので対象外、c は文書の閲覧用パスワードでアクセス制御機能ではないため対象外。（第04回 問4）"},
{c:"第04回 法務",t:"設計までA社が行い、開発を①請負でB社、②派遣でC氏が行う。契約に定めがないとき、プログラムの著作権の帰属先は？",o:["請負→A社、派遣→C氏","請負→B社、派遣→A社","請負→B社、派遣→C氏","請負→A社、派遣→A社"],a:1,e:"請負＝作った受託者(B社)に帰属。派遣＝指揮命令する派遣先(A社)に帰属。"},
{c:"第04回 法務",t:"取得した個人情報の管理に関する行為a〜cのうち、個人情報保護法において、本人に通知又は公表が必要となるものだけを全て挙げたものはどれか。\na. 個人情報の入力業務の委託先の変更\nb. 個人情報の利用目的の合理的な範囲での変更\nc. 利用しなくなった個人情報の削除",o:["a，b","a","b，c","b"],a:3,e:"利用目的を変更したときは本人への通知または公表が必要（b）。委託先の変更（a）や不要になった個人情報の削除（c）には通知・公表義務はない。（第04回 問3）"},

{c:"第05回 労働・取引",t:"労働者派遣における派遣労働者の雇用関係として適切なものはどれか。",o:["派遣先との間に雇用関係があり、派遣元との間には存在しない","派遣元との間に雇用関係があり、派遣先との間には存在しない","派遣元・派遣先の双方と雇用関係がある","どちらとも雇用関係はない"],a:1,e:"雇用＝派遣元、指揮命令＝派遣先。給与も派遣元が支払う。🔥（第05回・ITパス令和6 問32）"},
{c:"第05回 労働・取引",t:"労働者派遣に関する記述a〜cのうち、適切なものだけを全て挙げたものはどれか。\na. 派遣契約の種類によらず派遣労働者の選任は派遣先が行う\nb. 派遣労働者であった者を、派遣元との雇用期間が終了後、派遣先が雇用してもよい\nc. 派遣労働者の給与を派遣先が支払う",o:["a","a，b","b，c","b"],a:3,e:"派遣労働者の選任（a）も給与の支払い（c）も派遣元が行う。派遣期間終了後に派遣先が直接雇用すること（b）は可能。（第05回 問2）"},
{c:"第05回 労働・取引",t:"企業の行為に関する記述a〜cのうち、コンプライアンスにおいて問題となるおそれのある行為だけを全て挙げたものはどれか。\na. 誰でも応募でき、商品名の一部を答えるだけの簡単なクイズを新聞・自社HP・雑誌に広く掲載し、抽選で現金10万円が当たるキャンペーンを実施した\nb. 人気Webサイトを運営する企業が、広告主から依頼された商品を好意的に評価する記事を、広告と表示せず一般記事として掲載した\nc. フランスをイメージしてデザインしたバッグを国内で製造し、原産国を記載せずパリの風景写真とフランス国旗だけを印刷したタグを添付して販売した",o:["a，b","a，c","b，c","a，b，c"],a:2,e:"b＝ステルスマーケティング（景品表示法の不当表示）、c＝原産国を誤認させる表示。a は誰でも応募できるオープン懸賞で、景品表示法の景品規制の対象外なので問題なし。（第05回 問3）"},
{c:"第05回 労働・取引",t:"基本設計からシステムテストまでを一括委託するときの請負契約の留意事項として適切なものはどれか。",o:["詳細設計が完了するまで契約締結を待たなければならない","委託費は契約書では定めず、完了時に協議して取り決める","受託者は原則として再委託できるので、制限するには契約で再委託の条件を決めておく","著作権は特段の定めがない限り委託者に帰属する"],a:2,e:"請負では再委託が原則自由。制限したいなら契約に書く。著作権は原則「受託者」に帰属する点にも注意。"},

{c:"第06回 経営戦略",t:"3C分析の説明として適切なものはどれか。",o:["時代・年齢・世代の三要因に分解して分析する","最新購買日・購買頻度・購買金額の三観点から分析する","総売上高の高い順に三グループに分類する","顧客・競合・自社の三つの観点から分析する"],a:3,e:"3C＝Customer／Competitor／Company。b は RFM分析、c は ABC分析。"},
{c:"第06回 経営戦略",t:"PPM で「市場シェアは低いが急成長市場にあり、将来の成長のために多くの資金投入が必要」な領域はどれか。",o:["負け犬","花形","問題児","金のなる木"],a:2,e:"成長率高×シェア低＝問題児。成長率高×シェア高＝花形、成長率低×シェア高＝金のなる木、両方低＝負け犬。"},
{c:"第06回 経営戦略",t:"オピニオンリーダーと呼ばれる消費者の商品購入に対する態度はどれか。",o:["商品が普及した後に自分の評価を友人に伝える","新商品の販売開始を待って、友人に先駆けて入手することに意欲を燃やす","新商品を販売初期の段階で購入し、その商品に関する情報を友人や知人に伝える","購入を決めるに当たって友人の評価や世間の評判を参考にする"],a:2,e:"オピニオンリーダー＝アーリーアダプター。初期に購入し、周囲に情報を発信する層。b はイノベーター。"},
{c:"第06回 経営戦略",t:"ISO 9001 を導入することで期待できるメリットはどれか。",o:["業界で技術仕様が標準化され、製品の品質向上や市場拡大が進む","品質管理に関する業務運営が標準化され、管理の質や効率が向上する","情報資産の取扱方法が標準化され、情報セキュリティの品質が向上する","貿易手続が標準化され、非関税障壁が減少する"],a:1,e:"ISO 9001＝品質マネジメント。14001＝環境、27001＝情報セキュリティ(ISMS)。"},

{c:"第07回 技術戦略",t:"イノベーションのジレンマに関する記述として最も適切なものはどれか。",o:["消費量が増えるに従い満足度が徐々に低下していく現象","全売上の大部分を少数の顧客が占めている状態","自社の新商品が既存商品のシェアを奪ってしまう現象","優良な大企業が既存技術の向上に注力してしまい、結果的に市場でのシェア確保に失敗する現象"],a:3,e:"a=限界効用逓減、c=カニバリゼーション。"},
{c:"第07回 技術戦略",t:"製品P＝部品Q×2、部品Q＝部品R×4。Q在庫1個、R在庫3個。Pを6個生産するのに R はあと何個必要か。",o:["48","41","44","45"],a:1,e:"Q必要12個－在庫1＝11個。R必要 11×4＝44個－在庫3＝41個。"},
{c:"🔥第07回 技術戦略",t:"次の事例のうち、AIを導入することによって業務の作業効率が向上したものだけを全て挙げたものはどれか。\na. 食品専門商社A社が、取引先ごとに様式が異なる手書きの請求書の文字を自動で読み取ってデータ化し、事務作業時間を削減した\nb. 繊維製造会社B社が、原材料を取引先に発注する定型的なPC操作を自動化するツールを導入し、事務部門の人員を削減した\nc. 損害保険会社C社が、コールセンターへの問合せに対し、オペレーターにつなげる前に音声チャットボットでヒアリングを行い対応時間を短縮した\nd. 物流会社D社が、配送荷物に電子タグを装着して配送先を書き込み、配送時に確認することで誤配送を削減した",o:["b，d","a，c","c，d","b，c"],a:1,e:"a＝手書き文字認識（AI-OCR）、c＝音声認識チャットボット でどちらもAI。b は RPA（定型操作の自動化）、d は電子タグ（RFID）でAIではない。第07回とITパスポート令和6 問28で完全に同じ問題が出題されている。"},
{c:"第07回 技術戦略",t:'政府の"人間中心のAI社会原則"で実現を追求すべき社会の姿だけを全て挙げたものはどれか。\na.持続性ある社会 b.多様な背景を持つ人々が多様な幸せを追求できる社会 c.人間があらゆる労働から解放される社会 d.人間の尊厳が尊重される社会',o:["a, b, d","b, c, d","a, c, d","a, b, c"],a:0,e:"c「あらゆる労働から解放される社会」は含まれない（引っかけ）。"},
{c:"第07回 技術戦略",t:"部品製造会社が歩留り率を業績評価指標にした。バランススコアカードの四つの視点のうちどれに設定するのが適切か。",o:["学習と成長","業務プロセス","顧客","財務"],a:1,e:"BSC の4視点＝財務／顧客／業務プロセス／学習と成長。歩留り率は製造工程の指標なので業務プロセス。"},

{c:"第08回 システム戦略",t:"IoT に関する事例として最も適切なものはどれか。",o:["授業をあらかじめ録画しインターネットで配信する","発電設備の運転状況をインターネット経由で遠隔監視し、性能管理や不具合の予兆検知に役立てる","ある商品を検索すると類似商品の広告が表示される","自分のプロファイルを公開しコミュニケーションの輪を広げる"],a:1,e:"IoT＝モノがネットにつながり状態を収集・制御すること。"},
{c:"第08回 システム戦略",t:"RPA(Robotic Process Automation) の特徴として最も適切なものはどれか。",o:["工場での非定型的な作業に適している","受注データの入力や更新など、PCで実施する定型的な作業に適している","PCで実施する非定型的な作業に適している","工場での定型的な作業に適している"],a:1,e:"RPA＝PC上の定型業務の自動化。工場の物理作業ではない。"},
{c:"第08回 システム戦略",t:"SaaS の説明として最も適切なものはどれか。",o:["OSやDBなどアプリの稼働に必要な基盤をネットワーク経由で提供","必要な規模のハードウェア機能をサービスとして提供","インターネットへの接続サービスを提供","アプリケーションソフトウェアの必要な機能だけを必要なときにネットワーク経由で提供"],a:3,e:"SaaS＝アプリ、PaaS＝実行基盤(a)、IaaS＝インフラ(b)。"},
{c:"🔥第08回",t:"ビジネス・データ・アプリケーション・技術の四階層で現状を把握し理想像との乖離を明確にして移行計画を定義する最適化手法はどれか。",o:["EA(Enterprise Architecture)","BI(Business Intelligence)","MOT(Management of Technology)","SOA(Service Oriented Architecture)"],a:0,e:"EA。第08回小テストと第九回スライドで2回出題された超頻出。"},
{c:"第08回 法務",t:"マネーロンダリングの対策に関する記述として、最も適切なものはどれか。",o:["紙幣の印刷に当たり、コピー機では再現困難な文字や線、傾けることによって絵が浮かび上がるホログラムなどの技術を用いて、複製を困難にする","金融取引に当たり、口座開設時の取引目的や本人確認を徹底し、資金の出所が疑わしい取引かどうかを監視する","投資に当たり、安全性や収益性などの特徴が異なる複数の金融商品を組み合わせることによって、一つの事象によって損失が大きくなるリスクを抑える","税金の徴収に当たり、外国にある子会社の利益を本国の親会社に配当されたものとみなして、本国で課税する"],a:1,e:"マネーロンダリング＝不正な資金の出所を隠蔽すること。a=ポートフォリオ、c=偽造防止。"},

{c:"第09回 PM",t:"A社がB社にシステム開発を発注した。プロジェクトのステークホルダとなるものだけを全て挙げたものはどれか。\n①A社の経営者 ②A社の利用部門 ③B社のPM ④B社を技術支援する協力会社",o:["①②③④","②③④","①②④","②④"],a:0,e:"ステークホルダ＝プロジェクトに利害関係をもつ全ての人・組織。協力会社も含む。"},
{c:"第09回 PM",img:"09-Q2",t:"自分のデスクにあるPCと共有スペースにあるプリンターの起動を1人で行う。PCとプリンターの起動は図の条件で行い，それぞれの作業・処理は逐次実行する必要がある。自動処理の間は，移動やもう片方の作業を並行して行うことができる。自分のデスクにいる状態でPCの起動を開始し，移動してプリンターを起動した上で自分のデスクに戻り，PCの起動を終了するまでに必要な時間は，最短で何秒か。",o:["286","406","256","223"],a:3,e:"A(電源3秒・手作業) → B(150秒・自動処理)。この150秒の間にプリンターへ移動し E(3秒) を行い F(60秒・自動) を走らせて戻る。戻った後 C(10秒・手作業) → D(60秒・自動)。3＋150＋10＋60＝223秒。自動処理の間に別の作業を重ねるのがポイント。（第09回 問2）"},
{c:"🔥第09回 PM",t:"新機能の追加要求が変更管理委員会で認可された後、プロジェクトスコープマネジメントで実施する活動はどれか。",o:["新機能を追加開発するためにWBSを変更し、コストの詳細な見積りの情報として提供する","変更されたWBSに基づいてスケジュールを作成し完了時期の見通しを提示する","変更されたWBSに基づいて要員の充足度を確認し外注を検討する","必要なスキルを確認しチームの能力向上を図る"],a:0,e:"スコープマネジメントの守備範囲は WBS の変更まで。b=スケジュール、c/d=資源マネジメント。第09回とITパス令和6 問52で重複出題。"},
{c:"PM",t:"プロジェクトに該当する事例だけを全て挙げたものはどれか。\na.会社合併に伴う新組織への移行 b.サービスデスクの運用 c.新規経理システム導入のプログラム開発 d.毎年度末に実施する会計処理",o:["a, c","a, b, c","b, d","c, d"],a:0,e:"プロジェクト＝有期性＋独自性。継続的な運用や毎年の定型業務はプロジェクトではない。"},
{c:"PM",t:"プロジェクト終結時に、プロジェクト統合マネジメントで実施する活動として最も適切なものはどれか。",o:["残作業を洗い出す","成果物を検収する","要員を解散する","知識や教訓を組織の資産として登録する"],a:3,e:"教訓（Lessons Learned）の組織資産化が統合マネジメントの終結プロセス。"},

{c:"🔥第10回 SM",t:"ファシリティマネジメントの観点から行う対策だけを全て挙げたものはどれか。\na.コンピュータ室への入室を認可した者だけに限定 b.コンピュータの設置場所を示す標識を掲示しない c.利用者PCにマルウェア対策ソフトを導入",o:["b, c","a のみ","a, c","a, b"],a:3,e:"ファシリティ＝施設・設備。マルウェア対策は情報セキュリティ管理であって FM ではない。第10回とITパス令和6 問43で重複。"},
{c:"第10回 SM",img:"10-Q2",t:"図のアローダイアグラムにおいて，作業Bが2日遅れて完了した。そこで，予定どおりの期間で全ての作業を完了させるために，作業Dに要員を追加することにした。作業Dに当初20名が割り当てられているとき，作業Dに追加する要員は最少で何名必要か。ここで，要員の作業効率は一律である。",o:["5","2","3","4"],a:0,e:"作業Dは本来10日。Bが2日遅れたので8日で終える必要がある。20名×10日＝200人日 → 200÷8＝25名。よって追加は5名。（第10回 問2）"},
{c:"第10回 SM",t:"24時間対応の実現方法についてA社とB社が合意する文書として最も適切なものはどれか。",o:["SLM","NDA","SLA","BCP"],a:2,e:"SLA＝サービスレベル合意書。SLM は SLA を PDCA で管理する活動、NDA は秘密保持契約。"},
{c:"第10回 SM",t:"サービスデスクの業務改善に関する記述として最も適切なものはどれか。",o:["一時的な回避策は提示せず、根本原因の検討に注力する","受け付けた問合せの内容や回答、費やした時間などを記録して分析を行う","重要度にかかわらず受付順に回答する","問合せ窓口を種別ごとにできるだけ細かく分ける"],a:1,e:"記録と分析が改善の基本。サービスデスクはまず一時回避策で早期復旧（インシデント管理）。"},
{c:"🔥第10回 QC",t:"プログラムステップ数と不良件数の「関係性」を示す図として適切なものはどれか。",o:["管理図","散布図","パレート図","特性要因図"],a:1,e:"2項目の相関＝散布図。頻度順の棒＋累積折れ線＝パレート図、原因の洗い出し＝特性要因図。"},
{c:"QC",t:"根本原因を集計し発生頻度順に棒グラフで示し、累積値を折れ線で重ねた図はどれか。",o:["管理図","散布図","特性要因図","パレート図"],a:3,e:"パレート図。重点管理（ABC分析）に使う。"},

{c:"🔥第11回 ガバナンス",t:"ITガバナンスに関する記述として適切なものはどれか。",o:["IT部門が全社のITに関する原則やルールを独自に定めて周知する","経営者の責任であり、活動は全て経営者が行う","経営者がITに関する原則や方針を定めて、各部署で方針に沿った活動を実施する","ITベンダーが構築すべきもので、それ以外の組織では必要ない"],a:2,e:"主体は経営者だが実行は各部署。ITガバナンスは「現在と将来」の事業目的を支援する観点で評価する。"},

function applyTheme(t){
 document.documentElement.dataset.theme=t;
 const b=document.getElementById('themeBtn');
 if(b)b.textContent=(t==='dark'?'☀️ ライト':'🌙 ダーク');
 try{localStorage.setItem('quizTheme',t)}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
(function(){let t='dark';try{t=localStorage.getItem('quizTheme')||'dark'}catch(e){}applyTheme(t)})();
let sel={},order=[],optMap={},shufOn=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(){
 order=Q.map((_,i)=>i); optMap={};
 Q.forEach((q,i)=>optMap[i]=q.o.map((_,j)=>j));
 if(shufOn){shArr(order);Q.forEach((q,i)=>shArr(optMap[i]))}
}
function clearAll(){
 sel={};render();
 document.getElementById('score').textContent=`0 / ${Q.length}`;
 document.getElementById('prog').textContent='未作答';
 document.getElementById('res').className='res';
 window.scrollTo({top:0,behavior:'smooth'});
}
function doShuffle(){shufOn=true;buildOrder();clearAll();syncBtn()}
function noShuffle(){shufOn=false;buildOrder();clearAll();syncBtn()}
function syncBtn(){
 const b=document.getElementById('shufBtn'),o=document.getElementById('origBtn');
 if(!b)return;
 b.textContent=shufOn?'🔀 もう一度シャッフル':'🔀 シャッフル';
 b.className=shufOn?'':'ghost';
 o.className=shufOn?'ghost':'ghost on';
 document.getElementById('shufNote').textContent=shufOn?'（出題順・選択肢順をランダム化中）':'';
}
function render(){
 document.getElementById('quiz').innerHTML=order.map((qi,pos)=>{const q=Q[qi];return `
 <div class="q" id="q${qi}">
   <div class="tag${/🔥|🔴/.test(q.c)?' hot':''}">${pos+1}. ${esc(q.c)}</div>
   <div class="qt">${esc(q.t)}</div>
   ${q.img?`<div class="fig"><img src="${IMG[q.img]}" alt="図"></div>`:''}
   <div class="opts">${optMap[qi].map(oi=>`<div class="opt${q.oimg?' oi':''}" data-q="${qi}" data-o="${oi}" onclick="pick(${qi},${oi})">${q.oimg?`<span class="ol">${'abcd'[oi]}</span><img src="${IMG[q.oimg[oi]]}" alt="選択肢">`:esc(q.o[oi])}</div>`).join('')}</div>
   <div class="exp" id="e${qi}"></div>
 </div>`}).join('');
}
function pick(i,j){
 sel[i]=j;
 document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>el.classList.toggle('sel',+el.dataset.o===j));
 document.getElementById('prog').textContent=`已作答 ${Object.keys(sel).length} / ${Q.length}`;
}
function grade(){
 let n=0;const wrong=[];
 Q.forEach((q,i)=>{
  const ok=sel[i]===q.a; if(ok)n++; else wrong.push(order.indexOf(i)+1);
  document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
   const o=+el.dataset.o; el.classList.remove('sel');
   if(o===q.a)el.classList.add('ok');
   else if(o===sel[i])el.classList.add('no');
  });
  const e=document.getElementById('e'+i);
  e.className='exp show';
  e.innerHTML=`<b>${ok?'✅ 正解':'❌ 不正解'}</b>　正解：${q.oimg?`<b>${'abcd'[q.a]}</b><br><img src="${IMG[q.oimg[q.a]]}" style="max-width:220px;vertical-align:middle">`:esc(q.o[q.a])}<br>${esc(q.e)}`;
 });
 wrong.sort((a,b)=>a-b);
 document.getElementById('score').textContent=`${n} / ${Q.length}`;
 const pct=Math.round(n/Q.length*100);
 const r=document.getElementById('res');r.className='res show';
 r.innerHTML=`<h3 style="margin:0 0 8px">得分 ${n}/${Q.length}（${pct}%）</h3>
  <p style="margin:0">${pct>=90?'この調子で本番も。持ち込み不可なので、直前にもう一周して記憶を固めよう。':pct>=70?'合格ラインは8割。間違えた回を読み直して、もう一度この測験を回そう。':'まずは《小テスト全13回 過去問集》を通読してから再挑戦を。'}</p>
  ${wrong.length?`<p style="margin:8px 0 0;color:var(--warn)">错题：第 ${wrong.join('、')} 题（画面上の番号）</p>`:''}`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function reset(){clearAll()}
buildOrder();render();syncBtn();
document.getElementById('score').textContent=`0 / ${Q.length}`;
</script>
