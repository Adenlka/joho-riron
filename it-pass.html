<!DOCTYPE html>

<head>

<title>ITパスポート 過去問ドリル（残り20%対策）</title>
<style>
:root{
 --bg:#f4f6f9; --fg:#1c2430; --muted:#66707f; --card:#fff; --card2:#fbfcfe;
 --line:#dde3ea; --accent:#2f6fed; --accent-fg:#fff;
 --ghost-bg:#eef2f8; --ghost-fg:#2f4a7a;
 --tag-bg:#eef2f8; --tag-fg:#4a6a9a; --hot-bg:#ffeaea; --hot-fg:#b03030;
 --sel-bg:#eaf1ff; --ok-bd:#1f9d55; --ok-bg:#e8f7ee; --no-bd:#d64545; --no-bg:#fdeaea;
 --exp-bg:#f7f9fc; --shadow:rgba(0,0,0,.05); --figbg:#fff; --warn:#a33;
 color-scheme:light;
}
html[data-theme="dark"]{
 --bg:#11151b; --fg:#e4e9f0; --muted:#95a2b6; --card:#1a2028; --card2:#202832;
 --line:#2d3641; --accent:#5590ff; --accent-fg:#0c1016;
 --ghost-bg:#242c37; --ghost-fg:#a9bdd9;
 --tag-bg:#242c37; --tag-fg:#9db4d4; --hot-bg:#3b2127; --hot-fg:#ff9d9d;
 --sel-bg:#1d3052; --ok-bd:#41c47c; --ok-bg:#152f20; --no-bd:#e26c6c; --no-bg:#331b1e;
 --exp-bg:#19202a; --shadow:rgba(0,0,0,.45); --figbg:#e9edf2; --warn:#ff9090;
 color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:24px 12px;line-height:1.75;transition:background .18s,color .18s}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.bar{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;z-index:5;box-shadow:0 2px 6px var(--shadow)}
.bar b{font-size:18px}
button{font:inherit;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
button.ghost{background:var(--ghost-bg);color:var(--ghost-fg)}
button.on{outline:2px solid var(--accent);outline-offset:-2px}
#themeBtn{margin-left:auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;background:var(--tag-bg);color:var(--tag-fg);border-radius:20px;padding:2px 10px;margin-bottom:8px}
.tag.hot{background:var(--hot-bg);color:var(--hot-fg)}
.qt{font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;background:var(--card2);transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--sel-bg)}
.opt.ok{border-color:var(--ok-bd);background:var(--ok-bg)}
.opt.no{border-color:var(--no-bd);background:var(--no-bg)}
.exp{margin-top:11px;padding:11px 14px;background:var(--exp-bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:14px;display:none}
.exp.show{display:block}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;display:none}
.res.show{display:block}
.fig{margin:10px 0;padding:10px;background:var(--figbg);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.fig img{max-width:100%;display:block}
.opt.oi{display:flex;align-items:center;gap:10px}
.opt.oi .ol{font-weight:700;color:var(--tag-fg);min-width:16px}
.opt.oi img{max-width:200px;background:var(--figbg);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>ITパスポート 過去問ドリル — 残り20%対策</h1>
<div class="sub">令和7年＋令和6年の <b>ストラテジ系・マネジメント系</b> 全 90 問（テクノロジ系は範囲外なので除外）<br>
🔁 = <b>課題テストでも出題された論点</b>（29問）＝ 本番でも出る確率が最も高い。ここから潰すこと。<br>
出典：ITパスポート試験ドットコム</div>

<div class="bar">
  <b id="score">0 / 0</b>
  <span id="prog" style="color:var(--muted)">未作答</span>
  <button id="shufBtn" onclick="doShuffle()">🔀 シャッフル</button>
  <button id="origBtn" class="ghost on" onclick="noShuffle()">↩ 元の順番</button>
  <span id="shufNote" style="color:var(--muted);font-size:12.5px"></span>
  <button onclick="grade()">採点する</button>
  <button id="themeBtn" class="ghost" onclick="toggleTheme()">🌙 ダーク</button>
  <button class="ghost" onclick="reset()">やり直す</button>
</div>

<script>
const IMG={};
const Q=[{"c": "令和7年 問1・ストラテジ系", "t": "A社がB社に作業の一部を請負契約で委託している。作業形態a～cのうち，いわゆる偽装請負とみなされる状態だけを全て挙げたものはどれか。a. B社の従業員が，A社内において，A社の責任者の指揮命令の下で作業／b. B社の従業員が，A社内において，B社の責任者の指揮命令の下で作業／c. B社の従業員が，B社内において，A社の責任者の指揮命令の下で作業", "o": ["a", "a，b", "a，c", "b，c"], "a": 2, "e": "正解：a，c"}, {"c": "令和7年 問2・ストラテジ系", "t": "従来の情報セキュリティマネジメントシステム規格を基礎に追加で制定されたもので，クラウドサービスに対応した情報セキュリティ管理体制を構築するためのガイドライン規格として，最も適切なものはどれか。", "o": ["ISO 14001", "JIS Q 15001", "ISO/IEC 27017", "ISO 9001"], "a": 2, "e": "正解：ISO/IEC 27017"}, {"c": "令和7年 問4・ストラテジ系", "t": "投資の優先度などの経営の戦略を策定するために，経済価値，希少性，模倣困難性及び組織の四つの要素で評価することによって，自社のもつ資源を分析する手法として，最も適切なものはどれか。", "o": ["4P", "PPM", "SWOT分析", "VRIO分析"], "a": 3, "e": "正解：VRIO分析"}, {"c": "令和7年 問6・ストラテジ系", "t": "特定電子メール法は，電子メールによる一方的な広告宣伝メールの送信を規制する法律である。次の送信事例のうち，特定電子メール法の規制対象となり得るものはどれか。", "o": ["広告宣伝メールの受信を拒否する旨の意思表示がないことを確認したのち，公表されている企業のメールアドレス宛てに広告宣伝メールを送信した。", "受信者から拒否通知があった場合には，それ以降の送信を禁止すればよいと考え，広告宣伝メールを送信した。", "内容は事務連絡と料金請求なので問題ないと考え，受信者本人の同意なく，メールを送信した。", "長年の取引関係にある企業担当者に対して，これまで納入してきた製品の新バージョンが完成したので，その製品に関する広告宣伝メールを送信した。"], "a": 1, "e": "正解：受信者から拒否通知があった場合には，それ以降の送信を禁止すればよいと考え，広告宣伝メールを送信した。"}, {"c": "🔁令和7年 問7・ストラテジ系", "t": "新しい概念やアイディアの実証を目的とした，開発の前段階における検証を表す用語はどれか。", "o": ["CRM", "PoC", "RAS", "SLA"], "a": 1, "e": "★課題テストでも出題された論点。正解：PoC"}, {"c": "令和7年 問9・ストラテジ系", "t": "ハッカソンに関する記述として，最も適切なものはどれか。", "o": ["定められたルールの下，ある主題について，肯定派と否定派といった異なる立場に分かれて議論する。", "情報セキュリティ分野で活躍したいという意志をもった若者が，合宿形式で情報セキュリティに関する実践的な知識を学ぶ。", "プログラマーやデザイナーなどから成る複数の参加チームが，与えられたテーマに関するプロトタイプを短期間で作成し，その成果を発表して競い合う。", "問題解決や利用者獲得などゲーム的な要素のない分野に，デジタル技術を活用したゲームの要素を取り入れることによって，利用者の参加を動機づける。"], "a": 2, "e": "正解：プログラマーやデザイナーなどから成る複数の参加チームが，与えられたテーマに関するプロトタイプを短期間で作成し，その成果を発表して競い合う。"}, {"c": "🔁令和7年 問10・ストラテジ系", "t": "生成AIにおいて，もっともらしいが事実とは異なる内容が出力されることを表す用語として，最も適切なものはどれか。", "o": ["エコーチェンバー", "シンギュラリティ", "ディープフェイク", "ハルシネーション"], "a": 3, "e": "★課題テストでも出題された論点。正解：ハルシネーション"}, {"c": "令和7年 問11・ストラテジ系", "t": "スマートファクトリーにおいても使用されている，FMS(Flexible Manufacturing System)に関する記述として，最も適切なものはどれか。", "o": ["技術革新を効果的に自社の経営に取り入れることによって，企業の成長を図る。", "生産工程の各段階で，原材料から完成製品までの資材の流れを適時・適量に管理する。", "生産時に必要となる部品などを必要な分だけ供給することによって，生産リードタイムを短縮する。", "複数の工作機械や産業用ロボットなどを有機的に結合し，生産プロセス全体を統括的に制御・管理する。"], "a": 3, "e": "正解：複数の工作機械や産業用ロボットなどを有機的に結合し，生産プロセス全体を統括的に制御・管理する。"}, {"c": "令和7年 問12・ストラテジ系", "t": "商標法におけるサービスマークを説明したものはどれか。", "o": ["企業が，企業そのものを他社と区別するために表示する商標である。", "製造業者，販売業者が提供する商品を，他社の商品と区別するために表示する商標である。", "大規模小売業者が開発したプライベートブランドの商品を，他社の商品と区別するために表示する商標である。", "輸送業者，金融業者などが提供する役務を，他社の役務と区別するために表示する商標である。"], "a": 3, "e": "正解：輸送業者，金融業者などが提供する役務を，他社の役務と区別するために表示する商標である。"}, {"c": "令和7年 問13・ストラテジ系", "t": "新しいITソリューションの活用の是非を判断するために，そのITソリューションの提供者に，活用事例や技術情報などの提供を依頼する文書として，最も適切なものはどれか。", "o": ["EDI", "KPI", "RFI", "RFP"], "a": 2, "e": "正解：RFI"}, {"c": "令和7年 問14・ストラテジ系", "t": "事業，経営情報に知財情報を組み込んで分析し，現状の俯瞰や将来展望などの分析結果を事業責任者，経営者と共有し，事業戦略又は経営戦略に反映させることを表す用語として，最も適切なものはどれか。", "o": ["CVC(Corporate Venture Capital)", "IPランドスケープ", "MOT(Management of Technology)", "SWOT分析"], "a": 1, "e": "正解：IPランドスケープ"}, {"c": "令和7年 問15・ストラテジ系", "t": "事業運営における意思決定の迅速化，組織の独立採算の推進を目的とし，一つの企業の中に事業領域ごとに独立した組織を設置する組織形態はどれか。", "o": ["カンパニー制組織", "機能別組織", "プロジェクト組織", "マトリックス組織"], "a": 0, "e": "正解：カンパニー制組織"}, {"c": "令和7年 問16・ストラテジ系", "t": "他人の電子メールの利用者IDとパスワードの取扱いに関する記述のうち，不正アクセス禁止法で規制されている行為だけを全て挙げたものはどれか。a. 正当な理由なく本人に無断で第三者に提供する／b. 他人のID・パスワードを無効にするマルウェアを作成する／c. 本人に無断で使用して，メールサーバ上の電子メールを閲覧する", "o": ["a，b，c", "a，c", "b，c", "c"], "a": 1, "e": "正解：a，c"}, {"c": "令和7年 問17・ストラテジ系", "t": "プロセスマイニングに関する記述として，最も適切なものはどれか。", "o": ["一連の業務で実際に遂行したシステムの操作ログなどを収集し，現行の業務プロセスの可視化，分析，モニタリングによって業務の課題を特定して改善を図る手法やツールである。", "業務プロセスをそれまでの習慣などにとらわれず，抜本的に再構築して業務効率の改善を図る手法である。", "膨大な文章データから必要な情報を抽出して分析する手法である。", "大量の計算処理で正しい値を算出する一連のプロセスを通じて，暗号資産を取得する手段である。"], "a": 0, "e": "正解：一連の業務で実際に遂行したシステムの操作ログなどを収集し，現行の業務プロセスの可視化，分析，モニタリングによって業務の課題を特定して改善を図る手法やツールである。"}, {"c": "令和7年 問19・ストラテジ系", "t": "仮想環境を用いた技術であるAR又はVRの活用事例のうち，VRの活用事例として，最も適切なものはどれか。", "o": ["顔を覆うように頭部にゴーグルを装着し，そのゴーグル内に投影された仮想空間に広がる火災や地震の映像を見ながら避難方法をイメージすることによって，防災訓練が行える。", "家具をオンラインで購入するときに，スマートフォンのカメラを通して画面に映っている現実の自分の部屋に，購入したい家具をリアルタイムに重ねて試し置きできる。", "史跡などにスマートフォンを向けることによって，昔あった建物の画像や説明情報が現実の風景と重なって画面に表示される。", "図鑑にスマートフォンをかざすことによって，図鑑の絵や写真に重なって生物の動画が見られる。"], "a": 0, "e": "正解：顔を覆うように頭部にゴーグルを装着し，そのゴーグル内に投影された仮想空間に広がる火災や地震の映像を見ながら避難方法をイメージすることによって，防災訓練が行える。"}, {"c": "令和7年 問21・ストラテジ系", "t": "基本的な機能やサービスは無償で提供し，追加の機能やサービスを有償で提供することで利益を上げるビジネスモデルを表す用語として，最も適切なものはどれか。", "o": ["フリーウェア", "フリーミアム", "フリーライド", "フリーランス"], "a": 1, "e": "正解：フリーミアム"}, {"c": "令和7年 問23・ストラテジ系", "t": "コーポレートガバナンスの強化に有効な施策だけを全て挙げたものはどれか。a. 株式公開買付けによる企業の買収／b. 執行役員制度の導入による経営と執行の分離／c. 独立性の高い社外取締役の選任", "o": ["a，b", "a，b，c", "b，c", "c"], "a": 2, "e": "正解：b，c"}, {"c": "🔁令和7年 問24・ストラテジ系", "t": "RPAに関する記述として，最も適切なものはどれか。", "o": ["企業の一部の業務を外部の組織に委託することによって，自社のリソースを重要な領域に集中したり，コストの最適化や業務の高効率化などを実現したりする。", "組立てや搬送などにハードウェアのロボットを用いることによって，工場の生産活動の自動化を実現する。", "システムの利用者が，主体的にシステム管理や運用を行うことによって，利用者のITリテラシーの向上や，システムベンダーへの依存の軽減などを実現する。", "ホワイトカラーの定型的な事務作業を，ソフトウェアのロボットに代替させることによって，自動化や効率化を図る。"], "a": 3, "e": "★課題テストでも出題された論点。正解：ホワイトカラーの定型的な事務作業を，ソフトウェアのロボットに代替させることによって，自動化や効率化を図る。"}, {"c": "🔁令和7年 問27・ストラテジ系", "t": "業務と情報システムを最適にすることを目的として，業務と情報システムの現状の把握と目標とする理想像の設定から現状と理想との乖離を明確にし，目標に向けた改善活動を移行計画として定義したい。このときに用いられる手法として，最も適切なものはどれか。", "o": ["BI(Business Intelligence)", "EA(Enterprise Architecture)", "MOT(Management of Technology)", "SOA(Service Oriented Architecture)"], "a": 1, "e": "★課題テストでも出題された論点。正解：EA(Enterprise Architecture)"}, {"c": "令和7年 問28・ストラテジ系", "t": "生成AIに関する記述として，最も適切なものはどれか。", "o": ["一切の学習を必要とせずに，新しいコンテンツを生成する。", "過去のデータから項目間の相関などを学習したモデルを用いて，現在のデータから将来の値を予測して出力する。", "作成したシナリオに基づいて動作するソフトウェアロボットによって業務を自動化する。", "自然言語で指示された内容に従って，事前に学習したデータを基に，新しいコンテンツを生成する。"], "a": 3, "e": "正解：自然言語で指示された内容に従って，事前に学習したデータを基に，新しいコンテンツを生成する。"}, {"c": "令和7年 問29・ストラテジ系", "t": "企業経営の中核となる考え方を，ミッション，ビジョン，バリューの三つに分けて示す場合，ビジョンとして示すものとして，最も適切なものはどれか。", "o": ["企業の存在意義や使命", "企業の存在意義や使命をふまえた，ある時点でのありたい姿", "戦略を実現するために重要となる業績管理指標", "戦略を実現するために重要となる成功要因"], "a": 1, "e": "正解：企業の存在意義や使命をふまえた，ある時点でのありたい姿"}, {"c": "令和7年 問31・ストラテジ系", "t": "ERPシステムの説明として，適切なものはどれか。", "o": ["企業内の個人がもつ営業に関する知識やノウハウを収集し，共有することによって，効率的，効果的な営業活動を支援するシステム", "経理や人事，生産，販売などの基幹業務と関連する情報を一元管理し，経営資源を最適配分することによって，効率的な経営の実現を支援するシステム", "原材料の調達から生産，販売に関する情報を，企業間で共有・管理することによって，ビジネスプロセスの全体最適を目指すシステム", "個々の顧客に関する情報や対応履歴などを管理することによって，きめ細かい顧客対応を実施し，顧客満足度の向上を支援するシステム"], "a": 1, "e": "正解：経理や人事，生産，販売などの基幹業務と関連する情報を一元管理し，経営資源を最適配分することによって，効率的な経営の実現を支援するシステム"}, {"c": "令和7年 問32・ストラテジ系", "t": "公共交通機関での移動履歴，Webサイトでの商品検索履歴，SNSやブログで発信したデータなど，個人の活動を記録する技術，又は記録そのものを表す用語として，最も適切なものはどれか。", "o": ["アクティビティ", "トランザクション", "ライフログ", "レコードキーピング"], "a": 2, "e": "正解：ライフログ"}, {"c": "令和7年 問34・ストラテジ系", "t": "ある商品を5,000個販売したところ，売上げが6,000万円，利益が400万円となった。商品1個当たりの変動費が7,000円であるとき，利益を1,000万円以上にするためには，少なくともあと何個販売すればよいか。", "o": ["500", "1,200", "6,200", "7,500"], "a": 1, "e": "正解：1,200"}, {"c": "令和7年 問35・ストラテジ系", "t": "マーケティング戦略の策定プロセスのうち，自社製品の差別化ポイントを明確化するものはどれか。", "o": ["セグメンテーション", "ターゲティング", "プロモーション", "ポジショニング"], "a": 3, "e": "正解：ポジショニング"}, {"c": "令和7年 問36・マネジメント系", "t": "合意したサービス提供時間帯のうち，実際に顧客がITサービスを利用できた時間の割合で表されるものはどれか。", "o": ["可用性", "機能性", "効率性", "使用性"], "a": 0, "e": "正解：可用性"}, {"c": "令和7年 問38・マネジメント系", "t": "情報セキュリティ監査の説明として，最も適切なものはどれか。", "o": ["一定の基準に基づいてITシステムの利活用に係る検証・評価を行い，ガバナンスの適切性などに対する保証や改善のための助言を行うもの", "コンピュータの盗難や不正な持出しを物理的に防止し，情報セキュリティを確保するためのツール", "組織体の価値及び組織体への信頼を向上させるために，ITシステムの利活用のあるべき姿を示すIT戦略と方針の策定及びその実現のための活動", "組織の情報資産に関わるリスクマネジメントが効果的に実施されているかどうかの検証又は評価"], "a": 3, "e": "正解：組織の情報資産に関わるリスクマネジメントが効果的に実施されているかどうかの検証又は評価"}, {"c": "令和7年 問40・マネジメント系", "t": "変更管理委員会が設置されているプロジェクトで変更要求が発生した場合の記述として，最も適切なものはどれか。", "o": ["変更管理委員会では，プロジェクトに関わるステークホルダ以外の第三者によって変更要求が審議される。", "変更管理委員会は，コストの増加や期日の延期を理由に変更要求を却下してよい。", "変更管理委員会は，スコープに変更が発生しない範囲で変更要求を受け付けなければならない。", "変更要求は，全てプロジェクトマネージャが承認した後に変更管理委員会で審議される。"], "a": 1, "e": "正解：変更管理委員会は，コストの増加や期日の延期を理由に変更要求を却下してよい。"}, {"c": "令和7年 問41・マネジメント系", "t": "システム開発プロジェクトで使用される技法のうち，スケジュール作成に用いる技法として，適切なものだけを全て挙げたものはどれか。a. DFD／b. 回帰分析／c. クリティカルパス法／d. プレシデンスダイアグラム法", "o": ["a，b", "a，d", "b，c", "c，d"], "a": 3, "e": "正解：c，d"}, {"c": "令和7年 問42・マネジメント系", "t": "床下にネットワーク配線などのために一定の高さの空間をとり，容易に取り外しが可能なパネルを床板として並べたものはどれか。", "o": ["フリーアクセスフロア", "フリーアドレス", "フリースペース", "フリースポット"], "a": 0, "e": "正解：フリーアクセスフロア"}, {"c": "🔁令和7年 問43・マネジメント系", "t": "営業部門の営業員が出張する際の出張旅費の手続に関して，組織間でけん制を日常的に実施している状況の記述として，最も適切なものはどれか。", "o": ["営業員が出張後に経理部門に提出した旅費精算の書類と証票類について，経理担当者が適切な内容であることを審査し，経理課長が承認する。", "営業員が出張後に旅費の精算を行い，上長が承認を行う。経理部門では承認済みであるので支払を行う。", "営業員は出張の事前申請を行って上長の承認を得た後に，切符や宿泊施設の手配を旅行会社に依頼する。", "会計年度における営業部門の旅費精算の書類と証票類から，監査人がサンプリングして，営業員の処理内容の適切性を確認する。"], "a": 0, "e": "★課題テストでも出題された論点。正解：営業員が出張後に経理部門に提出した旅費精算の書類と証票類について，経理担当者が適切な内容であることを審査し，経理課長が承認する。"}, {"c": "令和7年 問44・マネジメント系", "t": "システム開発の早い段階で，目に見える形で利用者の要求が確認できるように確認用のソフトウェアを作成するソフトウェア開発モデルとして，最も適切なものはどれか。", "o": ["アジャイル", "ウォーターフォール", "スパイラル", "プロトタイピング"], "a": 3, "e": "正解：プロトタイピング"}, {"c": "令和7年 問46・マネジメント系", "t": "開発が完了したソフトウェアを本番環境にインストールする手順を明確にし，それを実施する工程として，適切なものはどれか。", "o": ["ソフトウェア統合", "ソフトウェア導入", "妥当性確認", "利用者教育"], "a": 1, "e": "正解：ソフトウェア導入"}, {"c": "令和7年 問47・マネジメント系", "t": "利用者が銀行のATMのパネルを操作して入金処理を行う。この操作の要件を定義するときに，ソフトウェア開発の品質特性である使用性を考慮すべきインタフェースとして，最も適切なものはどれか。", "o": ["OSとパネルのインタフェース", "ソフトウェア間のインタフェース", "ハードウェアとOSのインタフェース", "利用者とパネルのインタフェース"], "a": 3, "e": "正解：利用者とパネルのインタフェース"}, {"c": "令和7年 問48・マネジメント系", "t": "顧客から委託されたシステム開発プロジェクトのスコープの対象として，適切なものだけを全て挙げたものはどれか。a. プロジェクトで作成する成果物／b. プロジェクトで使用する市販のスケジュール管理ツール／c. プロジェクトの要求事項を顧客が記載した文書", "o": ["a", "a，b", "b，c", "c"], "a": 0, "e": "正解：a"}, {"c": "令和7年 問49・マネジメント系", "t": "クラウドサービスを提供するA社では，サービスデスクの受付時間は午前9時から午後6時まで。サービスレベルを向上させるために，顧客向けのチャットボットを導入することにした。チャットボット導入の効果として，最も適切なものはどれか。", "o": ["オペレーターのチャットのスキルが向上する。", "オペレーターの電話対応のスキルが向上する。", "問合せの受付時間を拡大することが可能になる。", "ホームページ上に掲載しているFAQの内容が充実する。"], "a": 2, "e": "正解：問合せの受付時間を拡大することが可能になる。"}, {"c": "令和7年 問50・マネジメント系", "t": "チャットボットの説明として，最も適切なものはどれか。", "o": ["質問に対して，ソフトウェアがリアルタイムで自動応答する仕組み", "センサーを搭載した機器や制御装置が直接インターネットにつながり，お互いに情報をやり取りする仕組み", "人間に代わって荷物を運ぶなどの作業を行う機械的な仕組み", "ルール化された定型的な操作を人間の代わりにソフトウェアが自動で行う仕組み"], "a": 0, "e": "正解：質問に対して，ソフトウェアがリアルタイムで自動応答する仕組み"}, {"c": "🔁令和7年 問51・マネジメント系", "t": "社内で開発及び運用を行っている経理システムの内部監査を実施するとき，システム監査人として，最も適切なものはどれか。", "o": ["経理システムの運用担当者", "経理システムの開発を担当した委託会社の従業員", "経理システムの利用者である経理担当者", "経理とITの知識を有する経営者直轄組織の従業員"], "a": 3, "e": "★課題テストでも出題された論点。正解：経理とITの知識を有する経営者直轄組織の従業員"}, {"c": "🔁令和7年 問52・マネジメント系", "t": "A社は会計システムの再構築をB社に外部委託している。B社から納品される成果物の検収において，品質管理に係る手続を遵守しているかどうかのシステム監査を行う監査人として，適切な者は誰か。", "o": ["会計システムの再構築に関与しないA社の管理部門のリーダー", "会計システムの再構築を担当するA社のプロジェクトマネージャ", "会計システムの再構築を担当するB社のシステム開発リーダー", "会計システムの再構築を担当するB社の品質管理責任者"], "a": 0, "e": "★課題テストでも出題された論点。正解：会計システムの再構築に関与しないA社の管理部門のリーダー"}, {"c": "🔁令和7年 問53・マネジメント系", "t": "内部統制の基本的要素の一つである\"ITへの対応\"に関する記述として，最も適切なものはどれか。", "o": ["ITを活用すると業務処理を迅速化でき，不注意によるミスを全て防止できる。", "既存のITの利用者の拡大や，使い方の変更などで組織目標を達成できるのであれば，新たなITシステムの導入やITシステムの更新を強いるものではない。", "全ての業務プロセスをITで自動化することによって，業務プロセスを大幅に修正することが容易になる。", "組織の業務がITに大きく依存すると，内部統制の目的を達成することが難しくなる。"], "a": 1, "e": "★課題テストでも出題された論点。正解：既存のITの利用者の拡大や，使い方の変更などで組織目標を達成できるのであれば，新たなITシステムの導入やITシステムの更新を強いるものではない。"}, {"c": "令和7年 問55・マネジメント系", "t": "システム開発プロジェクトの人的資源に関する計画において，要員を適切に配置しより良いパフォーマンスを得るために考慮すべき事項として，適切なものだけを全て挙げたものはどれか。a. 必要なスキルが不足している場合はトレーニングを計画する／b. 必要なスキルよりも要員の確保を常に優先する／c. 要員の役割と責任は計画段階では明確にせず開始後に定める", "o": ["a", "a，b，c", "a，c", "c"], "a": 0, "e": "正解：a"}, {"c": "令和6年 問1・ストラテジ系", "t": "マーケティングオートメーション(MA)に関する記述として，最も適切なものはどれか。", "o": ["企業内に蓄積された大量のデータを分析して，事業戦略などに有効活用する。", "小売業やサービス業において，販売した商品単位の情報の収集・蓄積及び分析を行う。", "これまで人間が手作業で行っていた定型業務を，AIや機械学習などを取り入れたソフトウェアのロボットが代行することによって自動化や効率化を図る。", "見込み顧客の抽出，獲得，育成などの営業活動を効率化する。"], "a": 3, "e": "正解：見込み顧客の抽出，獲得，育成などの営業活動を効率化する。"}, {"c": "🔁令和6年 問2・ストラテジ系", "t": "情報システムに不正に侵入し，サービスを停止させて社会的混乱を生じさせるような行為に対して，国全体で体系的に防御施策を講じるための基本理念を定め，国の責務などを明らかにした法律はどれか。", "o": ["公益通報者保護法", "サイバーセキュリティ基本法", "不正アクセス禁止法", "情報流通プラットフォーム対処法"], "a": 1, "e": "★課題テストでも出題された論点。正解：サイバーセキュリティ基本法"}, {"c": "令和6年 問3・ストラテジ系", "t": "未来のある時点に目標を設定し，そこを起点に現在を振り返り，目標実現のために現在すべきことを考える方法を表す用語として，最も適切なものはどれか。", "o": ["PoC(Proof of Concept)", "PoV(Proof of Value)", "バックキャスティング", "フォアキャスティング"], "a": 2, "e": "正解：バックキャスティング"}, {"c": "令和6年 問4・ストラテジ系", "t": "従来の金融情報システムは堅ろう性が高い一方，柔軟性に欠けた。インターネット関連技術の取込みやそれらを活用するベンチャー企業と組むなどして，新たな価値や革新的なサービスを提供していく潮流を表す用語として，最も適切なものはどれか。", "o": ["オムニチャネル", "フィンテック", "ブロックチェーン", "ワントゥワンマーケティング"], "a": 1, "e": "正解：フィンテック"}, {"c": "令和6年 問5・ストラテジ系", "t": "ベンチャーキャピタルに関する記述として，最も適切なものはどれか。", "o": ["新しい技術の獲得や，規模の経済性の追求などを目的に，他の企業と共同出資会社を設立する手法", "株式売却による利益獲得などを目的に，新しい製品やサービスを武器に市場に参入しようとする企業に対して出資などを行う企業", "新サービスや技術革新などの創出を目的に，国や学術機関，他の企業など外部の組織と共創関係を結び，積極的に技術や資源を交換し，自社に取り込む手法", "特定された課題の解決を目的に，一定の期間を定めて企業内に立ち上げられ，構成員を関連部門から招集し，目的が達成された時点で解散する組織"], "a": 1, "e": "正解：株式売却による利益獲得などを目的に，新しい製品やサービスを武器に市場に参入しようとする企業に対して出資などを行う企業"}, {"c": "令和6年 問6・ストラテジ系", "t": "技術戦略の策定や技術開発の推進といった技術経営に直接の責任をもつ役職はどれか。", "o": ["CEO", "CFO", "COO", "CTO"], "a": 3, "e": "正解：CTO"}, {"c": "令和6年 問7・ストラテジ系", "t": "システム開発の上流工程において，業務プロセスのモデリングを行う目的として，最も適切なものはどれか。", "o": ["業務プロセスで取り扱う大量のデータを，統計的手法やAI手法などを用いて分析し，データ間の相関関係や隠れたパターンなどを見いだすため", "業務プロセスを可視化することによって，適切なシステム設計のベースとなる情報を整備し，関係者間で解釈を共有できるようにするため", "個々の従業員がもっている業務に関する知識・経験やノウハウを社内全体で共有し，創造的なアイディアを生み出すため", "プロジェクトに必要な要員を調達し，チームとして組織化して，プロジェクトの目的の達成に向けて一致団結させるため"], "a": 1, "e": "正解：業務プロセスを可視化することによって，適切なシステム設計のベースとなる情報を整備し，関係者間で解釈を共有できるようにするため"}, {"c": "令和6年 問9・ストラテジ系", "t": "企業の戦略立案やマーケティングなどで使用されるフェルミ推定に関する記述として，最も適切なものはどれか。", "o": ["正確に算出することが極めて難しい数量に対して，把握している情報と論理的な思考プロセスによって概数を求める手法である。", "特定の集団と活動を共にしたり，人々の動きを観察したりすることによって，慣習や嗜好，地域や組織を取り巻く文化を類推する手法である。", "入力データと出力データから，その因果関係を統計的に推定する手法である。", "有識者のグループに繰り返し同一のアンケート調査とその結果のフィードバックを行うことによって，ある分野の将来予測に関する総意を得る手法である。"], "a": 0, "e": "正解：正確に算出することが極めて難しい数量に対して，把握している情報と論理的な思考プロセスによって概数を求める手法である。"}, {"c": "令和6年 問10・ストラテジ系", "t": "不正競争防止法で規定されている限定提供データに関する記述として，最も適切なものはどれか。", "o": ["特定の第三者に対し，1回に限定して提供する前提で保管されている技術上又は営業上の情報は限定提供データである。", "特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術上又は営業上の情報(秘密として管理されているものを除く)は限定提供データである。", "特定の第三者に提供するために，金庫などで物理的に管理されている技術上又は営業上の情報は限定提供データである。", "不正競争防止法に定めのある営業秘密は限定提供データである。"], "a": 1, "e": "正解：特定の第三者に提供する情報として電磁的方法によって相当量蓄積され管理されている技術上又は営業上の情報(秘密として管理されているものを除く)は限定提供データである。"}, {"c": "🔁令和6年 問11・ストラテジ系", "t": "品質に関する組織やプロセスの運営管理を標準化し，マネジメントの質や効率の向上を目的とした方策として，適切なものはどれか。", "o": ["ISMSの導入", "ISO 9001の導入", "ITILの導入", "プライバシーマークの取得"], "a": 1, "e": "★課題テストでも出題された論点。正解：ISO 9001の導入"}, {"c": "🔁令和6年 問12・ストラテジ系", "t": "\"人間中心のAI社会原則\"に定められている七つの\"AI社会原則\"のうち，\"イノベーションの原則\"に関する記述として，最も適切なものはどれか。", "o": ["AIの発展によって人も併せて進化するように，国際化や多様化を推進し，大学，研究機関，企業など，官民における連携と，柔軟な人材の移動を促進する。", "AIの利用がもたらす結果については，問題の特性に応じて，AIの開発，提供，利用に携わった関係者が分担して責任を負う。", "サービスの提供者は，AIを利用している事実やデータの取得方法や使用方法，結果の適切性について，利用者に対する適切な説明を行う。", "情報弱者を生み出さないために，幼児教育や初等中等教育において，AI活用や情報リテラシーに関する教育を行う。"], "a": 0, "e": "★課題テストでも出題された論点。正解：AIの発展によって人も併せて進化するように，国際化や多様化を推進し，大学，研究機関，企業など，官民における連携と，柔軟な人材の移動を促進する。"}, {"c": "令和6年 問13・ストラテジ系", "t": "金融機関で，同一の顧客がもつ複数の口座を，氏名・生年月日・電話番号・住所などを手掛かりに集約し，顧客ごとに取りまとめて一元管理する手続を表す用語として，最も適切なものはどれか。", "o": ["アカウントアグリゲーション", "キーマッピング", "垂直統合", "名寄せ"], "a": 3, "e": "正解：名寄せ"}, {"c": "令和6年 問14・ストラテジ系", "t": "ある商品の販売量と気温の関係が一次式で近似できるとき，予測した気温から商品の販売量を推定する手法として，適切なものはどれか。", "o": ["回帰分析", "線形計画法", "デルファイ法", "パレート分析"], "a": 0, "e": "正解：回帰分析"}, {"c": "令和6年 問15・ストラテジ系", "t": "必要な時期に必要な量の原材料や部品を調達することによって，工程間の在庫をできるだけもたないようにする生産方式はどれか。", "o": ["BPO", "CIM", "JIT", "OEM"], "a": 2, "e": "正解：JIT"}, {"c": "🔁令和6年 問16・ストラテジ系", "t": "RPAが適用できる業務として，最も適切なものはどれか。", "o": ["ゲームソフトのベンダーが，ゲームソフトのプログラムを自動で改善する業務", "従業員の交通費精算で，交通機関利用区間情報と領収書データから精算伝票を作成する業務", "食品加工工場で，産業用ロボットを用いて冷凍食品を自動で製造する業務", "通信販売業で，膨大な顧客の購買データから顧客の購買行動に関する新たな法則を見つける業務"], "a": 1, "e": "★課題テストでも出題された論点。正解：従業員の交通費精算で，交通機関利用区間情報と領収書データから精算伝票を作成する業務"}, {"c": "令和6年 問17・ストラテジ系", "t": "技術開発戦略において作成されるロードマップを説明しているものはどれか。", "o": ["技術の競争力レベルと技術のライフサイクルを2軸としたマトリックス上に，自社の技術や新しい技術をプロットする。", "研究開発への投資とその成果を2軸とした座標上に，技術の成長過程をグラフ化し，旧技術から新技術への転換状況を表す。", "市場面からの有望度と技術面からの有望度を2軸としたマトリックス上に，技術開発プロジェクトをプロットする。", "横軸に時間，縦軸に市場，商品，技術などを示し，研究開発成果の商品化，事業化の方向性をそれらの要素間の関係で表す。"], "a": 3, "e": "正解：横軸に時間，縦軸に市場，商品，技術などを示し，研究開発成果の商品化，事業化の方向性をそれらの要素間の関係で表す。"}, {"c": "令和6年 問18・ストラテジ系", "t": "コーポレートガバナンスを強化した事例として，最も適切なものはどれか。", "o": ["女性が活躍しやすくするために労務制度を拡充した。", "迅速な事業展開のために，他社の事業を買収した。", "独立性の高い社外取締役の人数を増やした。", "利益が得られにくい事業から撤退した。"], "a": 2, "e": "正解：独立性の高い社外取締役の人数を増やした。"}, {"c": "令和6年 問19・ストラテジ系", "t": "ある銀行では，システムの接続仕様を外部に公開し，あらかじめ契約を結んだ外部事業者のアクセスを認めることによって，利便性の高い，高度なサービスを展開しやすくしている。このような取組を表す用語として，最も適切なものはどれか。", "o": ["BPO", "RPA", "オープンAPI", "技術経営"], "a": 2, "e": "正解：オープンAPI"}, {"c": "令和6年 問20・ストラテジ系", "t": "A社では，1千万円を投資して営業支援システムを再構築する。現状の運用費が5百万円／年，再構築後の運用費が4百万円／年，再構築による新たな利益の増加が2百万円／年であるとき，この投資の回収期間は何年か。", "o": ["2.5", "3.3", "5.0", "10.0"], "a": 1, "e": "正解：3.3"}, {"c": "令和6年 問21・ストラテジ系", "t": "あるソフトウェアは，定額の料金や一定の期間での利用ができる形態で提供されている。この利用形態を表す用語として，適切なものはどれか。", "o": ["アクティベーション", "アドウェア", "サブスクリプション", "ボリュームライセンス"], "a": 2, "e": "正解：サブスクリプション"}, {"c": "令和6年 問22・ストラテジ系", "t": "インターネットを介して個人や企業が保有する住宅などの遊休資産の貸出しを仲介するサービスや仕組みを表す用語として，最も適切なものはどれか。", "o": ["シェアードサービス", "シェアウェア", "シェアリングエコノミー", "ワークシェアリング"], "a": 2, "e": "正解：シェアリングエコノミー"}, {"c": "令和6年 問23・ストラテジ系", "t": "A社はRPAソフトウェアを初めて導入するに当たり，計画策定・先行導入・本格導入の3段階で進める。計画策定フェーズで実施する作業として，適切なものだけを全て挙げたものはどれか。a. 適用可能性を見極めるための概念検証を実施する／b. 全社展開するための導入と運用の手順書を作成する／c. 部門，業務を絞り込んで導入し，効果を実測する", "o": ["a", "a，c", "b", "b，c"], "a": 0, "e": "正解：a"}, {"c": "令和6年 問25・ストラテジ系", "t": "史跡などにスマートフォンを向けると，昔あった建物の画像や説明情報を現実の風景と重ねるように表示して，観光案内をできるようにした。ここで活用した仕組みを表す用語として，最も適切なものはどれか。", "o": ["AR", "GUI", "VR", "メタバース"], "a": 0, "e": "正解：AR"}, {"c": "令和6年 問26・ストラテジ系", "t": "データサイエンティストの役割に関する記述として，最も適切なものはどれか。", "o": ["機械学習や統計などの手法を用いてビッグデータを解析することによって，ビジネスに活用するための新たな知見を獲得する。", "企業が保有する膨大なデータを高速に検索できるように，パフォーマンスの高いデータベースを運用するためのシステム基盤を構築する。", "企業における情報システムに関するリスクを評価するために，現場でのデータの取扱いや管理についての実態を調査する。", "企業や組織における安全な情報システムの企画，設計，開発，運用を，サイバーセキュリティに関する専門的な知識や技能を活用して支援する。"], "a": 0, "e": "正解：機械学習や統計などの手法を用いてビッグデータを解析することによって，ビジネスに活用するための新たな知見を獲得する。"}, {"c": "🔁令和6年 問27・ストラテジ系", "t": "個人情報保護法では，あらかじめ本人の同意を得ていなくても個人データの提供が許される行為を規定している。該当するものだけを全て挙げたものはどれか。a. 事故で意識不明の人の会社に，総務担当者が本人の自宅電話番号を教えた／b. 保険会社の従業員に頼まれ，総務担当者が新入社員の名前と所属部門のリストを渡した／c. 金融犯罪被害者の個人情報を，捜査機関からの法令に基づく要請に応じて提供した", "o": ["a", "a，c", "b，c", "c"], "a": 1, "e": "★課題テストでも出題された論点。正解：a，c"}, {"c": "🔁令和6年 問28・ストラテジ系", "t": "次の事例のうち，AIを導入することによって業務の作業効率が向上したものだけを全て挙げたものはどれか。a. 手書きの請求書の文字を自動で読み取ってデータ化／b. 定型的なPC操作を自動化するツールを導入／c. 音声チャットボットでヒアリング／d. 配送荷物に電子タグを装着", "o": ["a，c", "b，c", "b，d", "c，d"], "a": 0, "e": "★課題テストでも出題された論点。正解：a，c"}, {"c": "令和6年 問29・ストラテジ系", "t": "優れたUXやビジネスモデルをデジタル技術によって創出し，業界における従来のサービスを駆逐してしまうことによって，その業界の既存の構造が破壊されるような現象を表す用語として，最も適切なものはどれか。", "o": ["デジタルサイネージ", "デジタルディスラプション", "デジタルディバイド", "デジタルトランスフォーメーション"], "a": 1, "e": "正解：デジタルディスラプション"}, {"c": "🔁令和6年 問30・ストラテジ系", "t": "自社の当期の損益計算書だけから計算できる経営指標だけを全て挙げたものはどれか。a. 売上高増加率／b. 売上高利益率／c. 自己資本利益率", "o": ["a", "a，b", "a，b，c", "b"], "a": 3, "e": "★課題テストでも出題された論点。正解：b"}, {"c": "🔁令和6年 問31・ストラテジ系", "t": "顧客との個々のつながりを意識して情報を頻繁に更新するSNSなどのシステムとは異なり，会計システムのように高い信頼性と安定稼働が要求される社内情報を扱うシステムの概念を示す用語として，最も適切なものはどれか。", "o": ["IoT(Internet of Things)", "PoC(Proof of Concept)", "SOE(Systems of Engagement)", "SOR(Systems of Record)"], "a": 3, "e": "★課題テストでも出題された論点。正解：SOR(Systems of Record)"}, {"c": "🔁令和6年 問32・ストラテジ系", "t": "労働者派遣における派遣労働者の雇用関係に関する記述のうち，適切なものはどれか。", "o": ["派遣先との間に雇用関係があり，派遣元との間には存在しない。", "派遣元との間に雇用関係があり，派遣先との間には存在しない。", "派遣元と派遣先のいずれの間にも雇用関係が存在する。", "派遣元と派遣先のいずれの間にも雇用関係は存在しない。"], "a": 1, "e": "★課題テストでも出題された論点。正解：派遣元との間に雇用関係があり，派遣先との間には存在しない。"}, {"c": "令和6年 問33・ストラテジ系", "t": "次の記述のうち，業務要件定義が曖昧なことが原因で起こり得る問題だけを全て挙げたものはどれか。a. 企画プロセスでシステム化構想がまとまらない／b. コーディングのミスによって意図と違う動作をする／c. 開発中に仕様変更による手戻りが頻発する／d. 適切な受入れテストを設計できない", "o": ["a，b", "b，c", "b，d", "c，d"], "a": 3, "e": "正解：c，d"}, {"c": "令和6年 問34・ストラテジ系", "t": "営業活動で入手した顧客に関する属性情報や顧客との交渉履歴などを蓄積し，社内で共有できるシステムとして，最も適切なものはどれか。", "o": ["CAEシステム", "MRPシステム", "SCMシステム", "SFAシステム"], "a": 3, "e": "正解：SFAシステム"}, {"c": "🔁令和6年 問35・ストラテジ系", "t": "実用新案に関する記述として，最も適切なものはどれか。", "o": ["今までにない製造方法は，実用新案の対象となる。", "自然法則を利用した技術的思想の創作で高度なものだけが，実用新案の対象となる。", "新規性の審査に合格したものだけが実用新案として登録される。", "複数の物品を組み合わせて考案した新たな製品は，実用新案の対象となる。"], "a": 3, "e": "★課題テストでも出題された論点。正解：複数の物品を組み合わせて考案した新たな製品は，実用新案の対象となる。"}, {"c": "🔁令和6年 問36・マネジメント系", "t": "プロジェクトに該当する事例として，適切なものだけを全て挙げたものはどれか。a. 会社合併に伴う新組織への移行／b. サービスデスクの運用／c. 新規の経理システム導入に向けたプログラム開発／d. 毎年度末に実施する会計処理", "o": ["a，c", "b，c", "b，d", "c"], "a": 0, "e": "★課題テストでも出題された論点。正解：a，c"}, {"c": "令和6年 問37・マネジメント系", "t": "システム開発プロジェクトを終結する時に，プロジェクト統合マネジメントで実施する活動として，最も適切なものはどれか。", "o": ["工程の進捗の予定と実績の差異を分析する。", "作成した全ての成果物の一覧を確認する。", "総費用の予算と実績の差異を分析する。", "知識や教訓を組織の資産として登録する。"], "a": 3, "e": "正解：知識や教訓を組織の資産として登録する。"}, {"c": "🔁令和6年 問38・マネジメント系", "t": "利用可能日を月曜日から金曜日，1日の利用可能時間を7時から22時まで，稼働率を98%以上でSLAを合意した。1週間の運用において，障害などでシステムの停止を許容できる時間は最大何時間か。", "o": ["0.3", "1.5", "1.8", "2.1"], "a": 1, "e": "★課題テストでも出題された論点。正解：1.5"}, {"c": "🔁令和6年 問39・マネジメント系", "t": "サービスデスクのKPIのうち，顧客満足度を高めるために値が小さい方が良いものだけを全て挙げたものはどれか。a. 目標時間内に対応完了した件数の割合／b. 1回の問合せで解決できた件数の割合／c. 二次担当へエスカレーションされた件数の割合／d. 担当者につながるまでに費やした時間", "o": ["a，b", "a，d", "b，c", "c，d"], "a": 3, "e": "★課題テストでも出題された論点。正解：c，d"}, {"c": "🔁令和6年 問40・マネジメント系", "t": "アジャイル開発に関する記述として，最も適切なものはどれか。", "o": ["開発する機能を小さい単位に分割して，優先度の高いものから短期間で開発とリリースを繰り返す。", "共通フレームを適用して要件定義，設計などの工程名及び作成する文書を定義する。", "システム開発を上流工程から下流工程まで順番に進めて，全ての開発工程が終了してからリリースする。", "プロトタイプを作成して利用者に確認を求め，利用者の評価とフィードバックを行いながら開発を進めていく。"], "a": 0, "e": "★課題テストでも出題された論点。正解：開発する機能を小さい単位に分割して，優先度の高いものから短期間で開発とリリースを繰り返す。"}, {"c": "🔁令和6年 問42・マネジメント系", "t": "システム監査人の役割として，適切なものだけを全て挙げたものはどれか。a. 監査計画を立案する／b. 監査報告書を作成し社内に公開する／c. 改善の実施を監査対象部門に指示する／d. 改善の実施状況をモニタリングする", "o": ["a，b", "a，d", "b，c", "c，d"], "a": 1, "e": "★課題テストでも出題された論点。正解：a，d"}, {"c": "🔁令和6年 問43・マネジメント系", "t": "情報システムに関する施設や設備を維持保全するために行うリスク対策のうち，ファシリティマネジメントの観点から行う対策として，適切なものだけを全て挙げたものはどれか。a. コンピュータ室への入室を認可した者だけに限定／b. コンピュータの設置場所を示す標識を掲示しない／c. 利用者のPCにマルウェア対策ソフトを導入", "o": ["a", "a，b", "a，c", "b，c"], "a": 1, "e": "★課題テストでも出題された論点。正解：a，b"}, {"c": "令和6年 問44・マネジメント系", "t": "提供しているITシステムが事業のニーズを満たせるように，人材，プロセス，情報技術を適切に組み合わせ，継続的に改善して管理する活動として，最も適切なものはどれか。", "o": ["ITサービスマネジメント", "システム監査", "ヒューマンリソースマネジメント", "ファシリティマネジメント"], "a": 0, "e": "正解：ITサービスマネジメント"}, {"c": "令和6年 問45・マネジメント系", "t": "本番稼働後の業務遂行のために，業務別にサービス利用方法の手順を示した文書として，最も適切なものはどれか。", "o": ["FAQ", "サービスレベル合意書", "システム要件定義書", "利用者マニュアル"], "a": 3, "e": "正解：利用者マニュアル"}, {"c": "🔁令和6年 問47・マネジメント系", "t": "ソフトウェアの開発におけるDevOpsに関する記述として，最も適切なものはどれか。", "o": ["開発側が重要な機能のプロトタイプを作成し，顧客とともにその性能を実測して妥当性を評価する。", "開発側では，開発の各工程でその工程の完了を判断した上で次工程に進み，総合テストで利用者が参加して操作性の確認を実施した後に運用側に引き渡す。", "開発側と運用側が密接に連携し，自動化ツールなどを活用して機能の導入や更新などを迅速に進める。", "システム開発において，機能の拡張を図るために，固定された短期間のサイクルを繰り返しながらプログラムを順次追加する。"], "a": 2, "e": "★課題テストでも出題された論点。正解：開発側と運用側が密接に連携し，自動化ツールなどを活用して機能の導入や更新などを迅速に進める。"}, {"c": "令和6年 問48・マネジメント系", "t": "システム監査で用いる判断尺度の選定方法に関する記述として，最も適切なものはどれか。", "o": ["システム監査ではシステム管理基準の全項目をそのまま使用しなければならない。", "システム監査のテーマに応じて，システム管理基準以外の基準を使用してもよい。", "システム監査のテーマによらず，システム管理基準以外の基準は使用すべきでない。", "アジャイル開発では，システム管理基準は使用すべきでない。"], "a": 1, "e": "正解：システム監査のテーマに応じて，システム管理基準以外の基準を使用してもよい。"}, {"c": "令和6年 問50・マネジメント系", "t": "ソフトウェア製品の品質特性のうち，RPAソフトウェアの使用性に関する記述として，最も適切なものはどれか。", "o": ["RPAが稼働するPCのOSが変わっても動作する。", "RPAで指定した時間及び条件に基づき，適切に自動処理が実行される。", "RPAで操作対象となるアプリケーションソフトウェアがバージョンアップされても，簡単な設定変更で対応できる。", "RPAを利用したことがない人でも，簡単な教育だけで利用可能になる。"], "a": 3, "e": "正解：RPAを利用したことがない人でも，簡単な教育だけで利用可能になる。"}, {"c": "🔁令和6年 問52・マネジメント系", "t": "システム開発プロジェクトにおいて，新機能の追加要求が変更管理委員会で認可された後にプロジェクトスコープマネジメントで実施する活動として，適切なものはどれか。", "o": ["新機能を追加で開発するためにWBSを変更し，コストの詳細な見積りをするための情報として提供する。", "新機能を追加で開発するためのWBSのアクティビティの実行に必要なスキルを確認し，必要に応じてプロジェクトチームの能力向上を図る。", "変更されたWBSに基づいてスケジュールを作成し，完了時期の見通しを提示する。", "変更されたWBSに基づいて要員の充足度を確認し，必要な場合は作業の外注を検討する。"], "a": 0, "e": "★課題テストでも出題された論点。正解：新機能を追加で開発するためにWBSを変更し，コストの詳細な見積りをするための情報として提供する。"}, {"c": "🔁令和6年 問53・マネジメント系", "t": "ITガバナンスに関する次の記述中のaに入れる字句として，最も適切なものはどれか。「経営者は，aの事業の目的を支援する観点で，効果的，効率的かつ受容可能なaのITの利用について評価する。」", "o": ["過去と現在", "現在", "現在と将来", "将来"], "a": 2, "e": "★課題テストでも出題された論点。正解：現在と将来"}, {"c": "🔁令和6年 問54・マネジメント系", "t": "事業活動に関わる法令の遵守などを目的の一つとして，統制環境，リスクの評価と対応，統制活動，情報と伝達，モニタリング，ITへの対応から構成される取組はどれか。", "o": ["CMMI", "ITIL", "内部統制", "リスク管理"], "a": 2, "e": "★課題テストでも出題された論点。正解：内部統制"}, {"c": "🔁令和6年 問55・マネジメント系", "t": "システム監査の目的に関する記述として，適切なものはどれか。", "o": ["開発すべきシステムの具体的な用途を分析し，システム要件を明らかにすること", "情報システムが設置されている施設とその環境を総合的に企画，管理，活用すること", "情報システムに係るリスクに適切に対応しているかどうかを評価することによって，組織体の目標達成に寄与すること", "知識，スキル，ツール及び技法をプロジェクト活動に適用することによってプロジェクトの要求事項を満足させること"], "a": 2, "e": "★課題テストでも出題された論点。正解：情報システムに係るリスクに適切に対応しているかどうかを評価することによって，組織体の目標達成に寄与すること"}];

function applyTheme(t){
 document.documentElement.dataset.theme=t;
 const b=document.getElementById('themeBtn');
 if(b)b.textContent=(t==='dark'?'☀️ ライト':'🌙 ダーク');
 try{localStorage.setItem('quizTheme',t)}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
(function(){let t='dark';try{t=localStorage.getItem('quizTheme')||'dark'}catch(e){}applyTheme(t)})();
let sel={},order=[],optMap={},shufOn=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(){
 order=Q.map((_,i)=>i); optMap={};
 Q.forEach((q,i)=>optMap[i]=q.o.map((_,j)=>j));
 if(shufOn){shArr(order);Q.forEach((q,i)=>shArr(optMap[i]))}
}
function clearAll(){
 sel={};render();
 document.getElementById('score').textContent=`0 / ${Q.length}`;
 document.getElementById('prog').textContent='未作答';
 document.getElementById('res').className='res';
 window.scrollTo({top:0,behavior:'smooth'});
}
function doShuffle(){shufOn=true;buildOrder();clearAll();syncBtn()}
function noShuffle(){shufOn=false;buildOrder();clearAll();syncBtn()}
function syncBtn(){
 const b=document.getElementById('shufBtn'),o=document.getElementById('origBtn');
 if(!b)return;
 b.textContent=shufOn?'🔀 もう一度シャッフル':'🔀 シャッフル';
 b.className=shufOn?'':'ghost';
 o.className=shufOn?'ghost':'ghost on';
 document.getElementById('shufNote').textContent=shufOn?'（出題順・選択肢順をランダム化中）':'';
}
function render(){
 document.getElementById('quiz').innerHTML=order.map((qi,pos)=>{const q=Q[qi];return `
 <div class="q" id="q${qi}">
   <div class="tag${/🔥|🔴/.test(q.c)?' hot':''}">${pos+1}. ${esc(q.c)}</div>
   <div class="qt">${esc(q.t)}</div>
   ${q.img?`<div class="fig"><img src="${IMG[q.img]}" alt="図"></div>`:''}
   <div class="opts">${optMap[qi].map(oi=>`<div class="opt${q.oimg?' oi':''}" data-q="${qi}" data-o="${oi}" onclick="pick(${qi},${oi})">${q.oimg?`<span class="ol">${'abcd'[oi]}</span><img src="${IMG[q.oimg[oi]]}" alt="選択肢">`:esc(q.o[oi])}</div>`).join('')}</div>
   <div class="exp" id="e${qi}"></div>
 </div>`}).join('');
}
function pick(i,j){
 sel[i]=j;
 document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>el.classList.toggle('sel',+el.dataset.o===j));
 document.getElementById('prog').textContent=`已作答 ${Object.keys(sel).length} / ${Q.length}`;
}
function grade(){
 let n=0;const wrong=[];
 Q.forEach((q,i)=>{
  const ok=sel[i]===q.a; if(ok)n++; else wrong.push(order.indexOf(i)+1);
  document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
   const o=+el.dataset.o; el.classList.remove('sel');
   if(o===q.a)el.classList.add('ok');
   else if(o===sel[i])el.classList.add('no');
  });
  const e=document.getElementById('e'+i);
  e.className='exp show';
  e.innerHTML=`<b>${ok?'✅ 正解':'❌ 不正解'}</b>　正解：${q.oimg?`<b>${'abcd'[q.a]}</b><br><img src="${IMG[q.oimg[q.a]]}" style="max-width:220px;vertical-align:middle">`:esc(q.o[q.a])}<br>${esc(q.e)}`;
 });
 wrong.sort((a,b)=>a-b);
 document.getElementById('score').textContent=`${n} / ${Q.length}`;
 const pct=Math.round(n/Q.length*100);
 const r=document.getElementById('res');r.className='res show';
 r.innerHTML=`<h3 style="margin:0 0 8px">得分 ${n}/${Q.length}（${pct}%）</h3>
  <p style="margin:0">${pct>=90?'この調子で本番も。持ち込み不可なので、直前にもう一周して記憶を固めよう。':pct>=70?'合格ラインは8割。間違えた回を読み直して、もう一度この測験を回そう。':'まずは《小テスト全13回 過去問集》を通読してから再挑戦を。'}</p>
  ${wrong.length?`<p style="margin:8px 0 0;color:var(--warn)">错题：第 ${wrong.join('、')} 题（画面上の番号）</p>`:''}`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function reset(){clearAll()}
buildOrder();render();syncBtn();
document.getElementById('score').textContent=`0 / ${Q.length}`;

</script>
