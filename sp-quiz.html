<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>システムプログラミング入門 期末模拟测验</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;background:#f4f6f9;color:#1c2430;margin:0;padding:24px 12px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#667;font-size:14px;margin-bottom:20px}
.bar{position:sticky;top:0;background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.bar b{font-size:18px}
button{font:inherit;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;background:#2f6fed;color:#fff}
button.ghost{background:#eef2f8;color:#2f4a7a}
.q{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;background:#eef2f8;color:#4a6a9a;border-radius:20px;padding:2px 10px;margin-bottom:8px}
.qt{font-weight:600;margin-bottom:10px;white-space:pre-wrap}
pre{background:#1e2430;color:#e8edf5;padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.55;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid #dde3ea;border-radius:8px;padding:9px 13px;cursor:pointer;background:#fbfcfe;transition:.12s}
.opt:hover{border-color:#2f6fed}
.opt.sel{border-color:#2f6fed;background:#eaf1ff}
.opt.ok{border-color:#1f9d55;background:#e8f7ee}
.opt.no{border-color:#d64545;background:#fdeaea}
.exp{margin-top:11px;padding:11px 14px;background:#f7f9fc;border-left:3px solid #2f6fed;border-radius:0 8px 8px 0;font-size:14px;display:none}
.exp.show{display:block}
.res{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:20px;margin-bottom:18px;display:none}
.res.show{display:block}
code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:13px}

button.on{outline:2px solid #2f6fed;outline-offset:-2px}
</style>
</head>
<body>
<div class="wrap">
<h1>システムプログラミング入門 — 期末模拟测验</h1>
<div class="sub">范围：中間試験（6/8）之后 ｜ 53 题（★ 标记 = 你实际做错过的真题）｜ 建议 40 分钟内完成</div>

  <b id="score">0 / 30</b>

  <span id="shufNote" style="color:#7b8798;font-size:12.5px"></span>
  <button onclick="grade()">批改并看解析</button>
  <button class="ghost" onclick="reset()">重做</button>
</div>

<div class="res" id="res"></div>
<div id="quiz"></div>
</div>

let sel={},order=[],optMap={},shufOn=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(){
 order=Q.map((_,i)=>i); optMap={};
 Q.forEach((q,i)=>optMap[i]=q.o.map((_,j)=>j));
 if(shufOn){shArr(order);Q.forEach((q,i)=>shArr(optMap[i]))}
}
function clearAll(){
 sel={};render();
 document.getElementById('score').textContent=`0 / ${Q.length}`;
 document.getElementById('prog').textContent='未作答';
 document.getElementById('res').className='res';
 window.scrollTo({top:0,behavior:'smooth'});
}
function doShuffle(){shufOn=true;buildOrder();clearAll();syncBtn()}
function noShuffle(){shufOn=false;buildOrder();clearAll();syncBtn()}
function syncBtn(){
 const b=document.getElementById('shufBtn'),o=document.getElementById('origBtn');
 if(!b)return;
 b.textContent=shufOn?'🔀 もう一度シャッフル':'🔀 シャッフル';
 b.className=shufOn?'':'ghost';
 o.className=shufOn?'ghost':'ghost on';
 document.getElementById('shufNote').textContent=shufOn?'（出題順・選択肢順をランダム化中）':'';
}
function render(){
 document.getElementById('quiz').innerHTML=order.map((qi,pos)=>{const q=Q[qi];return `
 <div class="q" id="q${qi}">
   <div class="tag">${pos+1}. ${esc(q.c)}</div>
   <div class="qt">${esc(q.t)}</div>
   ${q.code?`<pre>${esc(q.code)}</pre>`:''}
   <div class="opts">${optMap[qi].map(oi=>`<div class="opt" data-q="${qi}" data-o="${oi}" onclick="pick(${qi},${oi})">${esc(q.o[oi])}</div>`).join('')}</div>
   <div class="exp" id="e${qi}"></div>
 </div>`}).join('');
}
function pick(i,j){
 sel[i]=j;
 document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>el.classList.toggle('sel',+el.dataset.o===j));
 document.getElementById('prog').textContent=`已作答 ${Object.keys(sel).length} / ${Q.length}`;
}
function grade(){
 let n=0;const wrong=[];
 Q.forEach((q,i)=>{
  const ok=sel[i]===q.a; if(ok)n++; else wrong.push(order.indexOf(i)+1);
  document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
   const o=+el.dataset.o; el.classList.remove('sel');
   if(o===q.a)el.classList.add('ok');
   else if(o===sel[i])el.classList.add('no');
  });
  const e=document.getElementById('e'+i);
  e.className='exp show';
  e.innerHTML=`<b>${ok?'✅ 正解':'❌ 不正解'}</b>　正解：${esc(q.o[q.a])}<br>${esc(q.e)}`;
 });
 wrong.sort((a,b)=>a-b);
 document.getElementById('score').textContent=`${n} / ${Q.length}`;
 const pct=Math.round(n/Q.length*100);
 const r=document.getElementById('res');r.className='res show';
 r.innerHTML=`<h3 style="margin:0 0 8px">得分 ${n}/${Q.length}（${pct}%）</h3>
  <p style="margin:0">${pct>=90?'状态很好，保持这个手感。':pct>=70?'基础扎实，把错题所在章节再过一遍。':'先把错题对应的笔记章节重读，再重做一次。'}</p>
  ${wrong.length?`<p style="margin:8px 0 0;color:#a33">错题：第 ${wrong.join('、')} 题（画面上の番号）</p>`:''}`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function reset(){clearAll()}
buildOrder();render();syncBtn();
document.getElementById('score').textContent=`0 / ${Q.length}`;
</script>
</body>
</html>
