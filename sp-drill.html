<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>システムプログラミング入門 — 期末実戦演習（記述・コード込み）</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;background:#f4f6f9;color:#1c2430;margin:0;padding:20px 12px;line-height:1.7}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#667;font-size:14px;margin-bottom:16px}
.bar{position:sticky;top:0;background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:11px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bar b{font-size:17px}
button{font:inherit;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;background:#2f6fed;color:#fff}
button.ghost{background:#eef2f8;color:#2f4a7a}
button.sm{padding:4px 11px;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:#fff;border:1px solid #dde3ea;color:#40506a;font-size:13px;padding:5px 12px}
.filters button.on{background:#2f6fed;color:#fff;border-color:#2f6fed}
.q{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:16px 18px;margin-bottom:13px}
.head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:11px;background:#eef2f8;color:#4a6a9a;border-radius:20px;padding:2px 10px}
.tag.t{background:#e7f0ff;color:#1e4fa8;font-weight:600}
.tag.hot{background:#ffeaea;color:#b03030;font-weight:600}
.qt{font-weight:600;margin-bottom:9px;white-space:pre-wrap}
pre{background:#1e2430;color:#e8edf5;padding:11px 13px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.55;margin:8px 0;white-space:pre}
input[type=text]{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:7px 10px;border:1px solid #c8d2e0;border-radius:7px;width:100%;background:#fbfcfe}
input[type=text]:focus{outline:none;border-color:#2f6fed;background:#fff}
input.ok{border-color:#1f9d55;background:#f0faf4}
input.no{border-color:#d64545;background:#fdf1f1}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:9px 11px;border:1px solid #c8d2e0;border-radius:7px;width:100%;min-height:150px;background:#fbfcfe;line-height:1.5}
textarea:focus{outline:none;border-color:#2f6fed;background:#fff}
.flds{display:flex;flex-direction:column;gap:8px}
.fld{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.fld .lb{font-size:13px;color:#55637a;min-width:150px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;gap:10px}
.opt{border:1px solid #dde3ea;border-radius:8px;padding:8px 12px;cursor:pointer;background:#fbfcfe;transition:.12s}
.opt:hover{border-color:#2f6fed}
.opt.sel{border-color:#2f6fed;background:#eaf1ff}
.opt.ok{border-color:#1f9d55;background:#e8f7ee}
.opt.no{border-color:#d64545;background:#fdeaea}
.opt.ox{min-width:64px;text-align:center;font-size:17px}
.exp{margin-top:10px;padding:10px 13px;background:#f7f9fc;border-left:3px solid #2f6fed;border-radius:0 8px 8px 0;font-size:14px;display:none}
.exp.show{display:block}
.exp pre{margin:7px 0}
.chk{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.chk li{margin:2px 0}
.res{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:18px;margin-bottom:16px;display:none}
.res.show{display:block}
code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hide{display:none!important}

button.on{outline:2px solid #2f6fed;outline-offset:-2px}
</style>
</head>
<body>
<div class="wrap">
<h1>システムプログラミング入門 — 期末実戦演習</h1>
<div class="sub">中間試験以降 ｜ 全 87 問（記述・穴埋め 58 ／ ○× 10 ／ 選択 11 ／ コード記述 8）＝ 自動採点 130 点分<br>
上のボタンで<b>題型別・分野別に絞り込み</b>できます。<br>
入力欄は全角/半角・前後の空白を自動で吸収します。連続スペースも1つとして扱います。<br>
🔥 = 過去に実際に出題 ／ 🔴 = 前回間違えた問題</div>

<div class="filters" id="filters"></div>

<div class="bar">
  <b id="score">0 / 0</b>
  <span id="prog" style="color:#667">未採点</span>
  <button id="shufBtn" class="ghost" onclick="doShuffle()">🔀 シャッフル</button>
  <button id="origBtn" class="ghost on" onclick="noShuffle()">↩ 元の順番</button>
  <span id="shufNote" style="color:#7b8798;font-size:12.5px"></span>
  <button onclick="grade()">採点する</button>
  <button class="ghost" onclick="reset_()">やり直す</button>
  <button class="ghost" onclick="revealAll()">全部の答えを見る</button>
</div>

<div class="res" id="res"></div>
<div id="quiz"></div>
</div>

<script>
/* type: fill(記述/穴埋め) / ox(○×) / choice(選択) / code(コード記述) */
const Q=[
// ============ Linux コマンド 記述 ============
{ty:'fill',c:'Linuxコマンド',hot:1,q:'次の操作を行うコマンド名を答えなさい。（オプションは含まない）',f:[
 {lb:'ファイルの一覧を表示',a:['ls']},{lb:'ディレクトリの移動',a:['cd']},{lb:'現在のディレクトリを表示',a:['pwd']},
 {lb:'ファイルのコピー',a:['cp']},{lb:'ファイルの移動・改名',a:['mv']},{lb:'ファイルの削除',a:['rm']},
 {lb:'ファイルの内容を表示',a:['cat']},{lb:'ディレクトリの作成',a:['mkdir']},{lb:'ディレクトリの削除',a:['rmdir']},
 {lb:'マニュアルの確認',a:['man']}],
 e:'ミニテスト９ 問1 の12個のうち前半。cd は change directory、pwd は print working directory。'},

{ty:'fill',c:'Linuxコマンド',hot:1,q:'次の操作を行うコマンド名を答えなさい。（オプションは含まない）',f:[
 {lb:'並べかえ',a:['sort']},{lb:'重複行の消去',a:['uniq']},{lb:'文字の置き換え',a:['tr']},{lb:'ファイルの比較',a:['diff']},
 {lb:'指定文字列を含む行を抽出',a:['grep']},{lb:'空ファイル作成／時刻更新',a:['touch']}],
 e:'ミニテスト９・確認問題８で出題。tr は translate、uniq は隣接した重複のみ消す点に注意。'},

{ty:'fill',c:'Linuxコマンド',q:'src-file ファイルをコピーして dst-file ファイルを作成するコマンドを入力しなさい。',

{ty:'fill',c:'Linuxコマンド',q:'中にファイルが存在している test ディレクトリを削除するコマンドを入力しなさい。',

{ty:'fill',c:'Linuxコマンド',hot:1,q:'/media/cdrom/ の中身を最新更新日順に並べて表示するコマンドを入力しなさい。',

{ty:'fill',c:'Linuxコマンド',hot:1,q:'カレントディレクトリにあるファイルを、詳細形式かつ隠しファイルを含めて表示するコマンドを入力しなさい。',

{ty:'fill',c:'Linuxコマンド',q:'パス /etc の中のファイルで、ファイル名の一部に「resolv」という文字列が含まれるファイルを検索するコマンドを、1つのコマンドで完結するように入力しなさい。',
 f:[{a:['find /etc -name "*resolv*"',"find /etc -name '*resolv*'",'find /etc -name *resolv*']}],
 e:'find パス -name "パターン"。宿題Linux標準教科書(2) 問5。'},

{ty:'fill',c:'相対パス',hot:1,red:1,q:'カレントディレクトリが /home/hiu/student であるとき、ディレクトリを移動せずに /var/www/modules/test.txt の内容を表示したい。\n「相対パス」で指定するコマンドを入力しなさい。',
 f:[{a:['cat ../../../var/www/modules/test.txt']}],
 e:'student → hiu → home → / と3階層上がる必要があるので ../../../ 。ミニテスト８ 問7（前回不正解）。'},

{ty:'fill',c:'相対パス',q:'カレントディレクトリが /home/hiu/student であるとき、そこにある test.txt を /etc/www 以下に移動したい。\n移動元は相対パス、移動先は絶対パスで指定するコマンドを入力しなさい。',
 f:[{a:['mv test.txt /etc/www','mv ./test.txt /etc/www','mv test.txt /etc/www/']}],e:'ミニテスト８ 問8。'},

{ty:'fill',c:'Linuxコマンド',q:'カレントディレクトリにある hoge.txt の名前を piyo.txt に変更するコマンドを入力しなさい。',

// ============ パイプ・リダイレクト ============
{ty:'fill',c:'パイプ',hot:1,q:'ファイル「question.txt」に含まれる「g」「w」を「G」「W」に置き換えて表示するコマンドを記述しなさい。\n※回答にパイプを使用し、スペースは必要最小限とすること。',
 f:[{a:['cat question.txt | tr gw GW']}],e:'tr は「文字単位」の置換。tr 変換前 変換後。確認問題８ 問3。'},

{ty:'fill',c:'パイプ',hot:1,q:'ファイルの中身が AAABBBAAACCCCCCDDD となっている sample.txt から、完全に重複を削除して表示したい。\n※コマンドは必要最小限にすること。',
 f:[{a:['sort sample.txt | uniq','sort -u sample.txt','cat sample.txt | sort | uniq']}],
 e:'uniq は「隣接した」重複しか消せないので、必ず先に sort する。ミニテスト９ 問7。'},

{ty:'fill',c:'パイプ',q:'wget でダウンロードした dup.txt の重複を完全になくした状態で表示するコマンドを記述しなさい。（必ずパイプを用いること）',
 f:[{a:['sort dup.txt | uniq','cat dup.txt | sort | uniq']}],e:'課題9-1。'},

{ty:'fill',c:'パイプ',q:'replace.txt の中の "s" と "p" を大文字に置き換えて表示するコマンドを記述しなさい。',
 f:[{a:["cat replace.txt | tr 'sp' 'SP'",'cat replace.txt | tr sp SP','tr sp SP < replace.txt',"tr 'sp' 'SP' < replace.txt"]}],e:'課題9-2。'},

{ty:'fill',c:'リダイレクト',hot:1,q:'ls -l を実行した結果を ls-result ファイルに書き込むコマンドを記述しなさい。（スペースは必要最小限）',
 f:[{a:['ls -l > ls-result']}],e:'> は上書き。宿題Linux標準教科書(4) 問4。'},

{ty:'fill',c:'リダイレクト',hot:1,red:1,q:'cat コマンドとリダイレクト演算子を使用して、test1.txt の内容を既存の tests.txt ファイルに「追記」するコマンドを記述しなさい。',
 f:[{a:['cat test1.txt >> tests.txt']}],e:'> は上書き（既存内容が消える）、>> が追記。ミニテスト９ 問4（前回不正解）。'},

{ty:'fill',c:'リダイレクト',q:'genbu2 上で /etc 内のファイル・ディレクトリの一覧から "pro" で始まるものを抜き出し、~/Syspro2026/kadai13.txt に保存するコマンドを1行で記述しなさい。（ls にオプションは加えないこと）',
 f:[{a:['ls /etc | grep ^pro > ~/Syspro2026/kadai13.txt','ls /etc | grep "^pro" > ~/Syspro2026/kadai13.txt',"ls /etc | grep '^pro' > ~/Syspro2026/kadai13.txt"]}],
 e:'^pro は「行頭が pro」の正規表現。課題9-3。'},

{ty:'fill',c:'リダイレクト',q:'リダイレクトの記号と番号を答えなさい。',f:[
 {lb:'標準出力を上書き保存',a:['>']},{lb:'標準出力を追記',a:['>>']},{lb:'標準エラー出力を保存',a:['2>']},
 {lb:'標準入力の番号',a:['0']},{lb:'標準出力の番号',a:['1']},{lb:'標準エラー出力の番号',a:['2']}],
 e:'0=標準入力 / 1=標準出力 / 2=標準エラー出力。宿題Linux標準教科書(3) 問1。'},

{ty:'fill',c:'テキスト処理',hot:1,red:1,q:'ファイル「question.txt」の先頭7行を標準出力に出力するコマンドを記述しなさい。（スペースは必要最小限）',
 f:[{a:['head -n 7 question.txt','head -7 question.txt']}],e:'確認問題８ 問4（前回不正解）。'},

{ty:'fill',c:'テキスト処理',q:'ファイル ls-etc の終わり8行を表示するコマンドを記述しなさい。（スペースは必要最小限）',
 f:[{a:['tail -n 8 ls-etc','tail -8 ls-etc']}],e:'宿題Linux標準教科書(4) 問10。'},

{ty:'fill',c:'テキスト処理',q:'chkconfig --list の実行結果から iptables だけを絞り込んで表示するコマンドを grep を使って記述しなさい。',
 f:[{a:['chkconfig --list | grep iptables']}],e:'宿題Linux標準教科書(4) 問5。'},

// ============ 正規表現 ============
{ty:'fill',c:'正規表現',hot:1,red:1,q:'アルファベットの小文字から始まり、数字で終わる「5文字」の文字列を表す正規表現を記述しなさい。（空白は最小限）',
 f:[{a:['^[a-z]...[0-9]$']}],e:'5文字 = 先頭[a-z] + 任意3文字(...) + 末尾[0-9]。^ と $ で長さを固定する。宿題Linux標準教科書(3) 問3（前回不正解）。'},

{ty:'fill',c:'正規表現',q:'2文字目が数字以外で、4文字目・5文字目が xy である文字列を表す正規表現を記述しなさい。',

{ty:'fill',c:'正規表現',q:'grep を利用し、行頭が a または b で始まる行を抽出する正規表現部分を記述しなさい。（grep -e の後ろ）',
 f:[{a:['^[ab]']}],e:'[ ] は「その中の任意の1文字」。( ) や { } ではない。宿題Linux標準教科書(4) 問1。'},

{ty:'fill',c:'正規表現',q:'/usr/bin から「a で始まる3文字」のファイルを検索したい。grep -e の後ろに書く正規表現を記述しなさい。',
 f:[{a:['^a..$']}],e:'^a + 任意2文字 + $ で「ちょうど3文字」。宿題Linux標準教科書(4) 問2。'},

{ty:'fill',c:'正規表現',q:'正規表現の記号を答えなさい。',f:[
 {lb:'行頭を表す記号',a:['^']},{lb:'行末を表す記号',a:['$']},{lb:'任意の1文字',a:['.']},
 {lb:'その中の任意の一字',a:['[]','[ ]']}],e:'ミニテスト９ 問2。'},

{ty:'fill',c:'正規表現',q:'次のデータから「今年までに入学した情報大の学生アカウント」だけを抽出する正規表現を半角英数字で記述しなさい。\nデータ: s2212063 / s2312066 / s2412065 / s2512061 / s2612063 / s221206a / ss2212063 / s22120632 / helloworld\n抽出例: s2212063 s2312066 s2412065 s2512061',
 f:[{a:['^s2[2-5][0-9][0-9][0-9][0-9][0-9]$','^s2[2-5][0-9]{5}$']}],
 e:'①s で始まる ②入学年が22〜25 ③全部で8文字 ④末尾は数字。^ $ で挟まないと ss2212063 や s22120632 も通ってしまう。課題8 問5。'},

// ============ vi ============
{ty:'fill',c:'viエディタ',hot:1,q:'vi の操作に対応するコマンドを答えなさい。（: は省く）',f:[
 {lb:'ファイルを保存',a:['w']},{lb:'保存して終了',a:['wq']},{lb:'保存せず強制的に終了',a:['q!']}],
 e:'ミニテスト９ 問8。: を付けて :w / :wq / :q! と使う。'},

{ty:'fill',c:'viエディタ',hot:1,q:'vi のコマンドモードで、カーソルのある行を含めて5行をバッファにコピーするコマンドを記述しなさい。',
 f:[{a:['5yy']}],e:'yy = ヤンク（コピー）。5dd はカット（削除）。確認問題９ 問1。'},

{ty:'fill',c:'viエディタ',q:'vi で編集後、hello.txt という別ファイル名で新規保存して終了するコマンドを答えなさい。',

{ty:'fill',c:'viエディタ',q:'vi で文章内の HIU という語句を検索してカーソルを移動するコマンドを答えなさい。',

{ty:'fill',c:'viエディタ',q:'vi で編集中のファイルを強制的に保存して終了するコマンドを答えなさい。',

{ty:'fill',c:'viエディタ',q:'vi で文章の70行目にカーソルを移動するコマンドを答えなさい。',

{ty:'fill',c:'viエディタ',hot:1,q:'vi のコマンドモードで、ファイル全体の「システムプログラミング」を「シスプロ」に置換するコマンドを記述しなさい。',

{ty:'fill',c:'viエディタ',q:'vi のカーソル移動キーを答えなさい。',f:[
 {lb:'上に移動',a:['k']},{lb:'下に移動',a:['j']},{lb:'左に移動',a:['h']},{lb:'右に移動',a:['l']},

// ============ パーミッション ============
{ty:'fill',c:'パーミッション',hot:1,q:'アクセス権限の変換をしなさい。',f:[
 {lb:'rwx r-x r-x を8進数で',a:['755']},{lb:'644 を英字表記で',a:['rw-r--r--','rw- r-- r--']},
 {lb:'rw- r-- --- を8進数で',a:['640']},{lb:'700 を英字表記で',a:['rwx------','rwx --- ---']}],
 e:'r=4 w=2 x=1。ミニテスト１０ 問2・問3。'},

{ty:'fill',c:'パーミッション',q:'~/Syspro2026 に作成した www ディレクトリに対し、グループに書き込み権限を追加するコマンドを記述しなさい。（相対パス）',

{ty:'fill',c:'パーミッション',hot:1,q:'private.txt に対し、所有者には読み取りと書き込み、グループには読み取りのみ、その他には一切の権限を与えないコマンドを記述しなさい。',

 pt:['pcSearch と addrDisplay の2つの関数を定義している','ファイルを1行ずつ読み、郵便番号を含む行を探している','split(",") と strip(\'"\') でCSVを分解している','都道府県=[6]、市区町村=[7]、町域=[8] を使っている','input("郵便番号：") でプロンプトを出している'],
 e:'課題14（5/5）。csv モジュールを使う版が発展課題14-2。'},

let sel={},txt={},revealed={},order=[],optMap={},shufOn=false;
const cats=[...new Set(Q.map(q=>q.c))];
let filter='すべて';

function nrm(s){
 return (s||'').replace(/[Ａ-Ｚａ-ｚ０-９！-／：-＠［-｀｛-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/　/g,' ').replace(/[“”]/g,'"').replace(/[‘’]/g,"'")
  .trim().replace(/\s+/g,' ');
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function shArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(){
 order=Q.map((_,i)=>i); optMap={};
 Q.forEach((q,i)=>{optMap[i]=(q.o||[]).map((_,j)=>j)});
 if(shufOn){shArr(order);Q.forEach((q,i)=>{if(q.ty==='choice')shArr(optMap[i])})}
}
function doShuffle(){shufOn=true;buildOrder();reset_();syncBtn()}
function noShuffle(){shufOn=false;buildOrder();reset_();syncBtn()}
function syncBtn(){
 const b=document.getElementById('shufBtn'),o=document.getElementById('origBtn');
 if(!b)return;
 b.textContent=shufOn?'🔀 もう一度シャッフル':'🔀 シャッフル';
 b.className=shufOn?'':'ghost';
 o.className=shufOn?'ghost':'ghost on';
 document.getElementById('shufNote').textContent=shufOn?'（出題順＋選択肢順をランダム化中）':'';
}
function typeLabel(t){return {fill:'記述・穴埋め',ox:'○×',choice:'選択',code:'コード記述'}[t]}

function render(){
 document.getElementById('filters').innerHTML =
   ['すべて','記述・穴埋め','コード記述','○×','選択',...cats].map(c=>
   `<button class="${filter===c?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join('');

 document.getElementById('quiz').innerHTML=order.map((i,pos)=>{
  const q=Q[i];
  let body='';
  if(q.ty==='fill'){
   body=`<div class="flds">${q.f.map((f,j)=>
     `<div class="fld">${f.lb?`<span class="lb">${esc(f.lb)}</span>`:''}
      <input type="text" id="i${i}_${j}" oninput="mark(${i})" autocomplete="off" spellcheck="false"
      style="${f.lb?'flex:1;min-width:200px':''}"></div>`).join('')}</div>`;
  } else if(q.ty==='ox'){
   body=`<div class="opts row">${['○','×'].map((o,j)=>
     `<div class="opt ox" data-q="${i}" data-o="${j}" onclick="pick(${i},${j})">${o}</div>`).join('')}</div>`;
  } else if(q.ty==='choice'){
   body=`<div class="opts">${optMap[i].map(j=>
     `<div class="opt" data-q="${i}" data-o="${j}" onclick="pick(${i},${j})">${esc(q.o[j])}</div>`).join('')}</div>`;
  } else {
   body=`<textarea id="t${i}" spellcheck="false" placeholder="ここにコードを書いてから「採点する」または下のボタンで模範解答と見比べてください"></textarea>
    <div style="margin-top:7px"><button class="ghost sm" onclick="showModel(${i})">模範解答を見る</button></div>`;
  }
  return `<div class="q" data-cat="${esc(q.c)}" data-type="${typeLabel(q.ty)}" id="q${i}">
   <div class="head">
     <span class="tag t">${typeLabel(q.ty)}</span>
     <span class="tag${q.hot||q.red?' hot':''}">${pos+1}. ${esc(q.c)}${q.red?' 🔴':(q.hot?' 🔥':'')}</span>
   </div>
   <div class="qt">${esc(q.q)}</div>
   ${q.code?`<pre>${esc(q.code)}</pre>`:''}
   ${body}
   <div class="exp" id="e${i}"></div>
  </div>`;
 }).join('');
 applyFilter();
}
function setFilter(c){filter=c;render()}
function applyFilter(){
 document.querySelectorAll('.q').forEach(el=>{
  const ok = filter==='すべて' || el.dataset.cat===filter || el.dataset.type===filter;
  el.classList.toggle('hide',!ok);
 });
}
function pick(i,j){
 sel[i]=j;
 document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>el.classList.toggle('sel',+el.dataset.o===j));
 upd();
}
function mark(){upd()}
function upd(){
 let done=0;
 Q.forEach((q,i)=>{
  if(q.ty==='fill'){ if(q.f.some((f,j)=>(document.getElementById('i'+i+'_'+j)||{}).value)) done++ }
  else if(q.ty==='code'){ if((document.getElementById('t'+i)||{}).value) done++ }
  else if(sel[i]!==undefined) done++;
 });
 document.getElementById('prog').textContent=`入力済み ${done} / ${Q.length}`;
}
function showModel(i){
 const q=Q[i],e=document.getElementById('e'+i);
 e.className='exp show';
 e.innerHTML=`<b>模範解答</b><pre>${esc(q.m)}</pre>
  <b>採点ポイント（自己チェック）</b><ul class="chk">${q.pt.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
  <div style="margin-top:6px">${esc(q.e)}</div>`;
 revealed[i]=1;
}
function grade(){
 let got=0,total=0;const wrong=[];
 Q.forEach((q,i)=>{
  const e=document.getElementById('e'+i);
  if(q.ty==='fill'){
   let allOk=true;
   q.f.forEach((f,j)=>{
    total++;
    const el=document.getElementById('i'+i+'_'+j);
    const v=nrm(el.value);
    const ok=f.a.some(a=>nrm(a)===v);
    el.classList.toggle('ok',ok); el.classList.toggle('no',!ok);
    if(ok)got++; else allOk=false;
   });
   if(!allOk)wrong.push(order.indexOf(i)+1);
   e.className='exp show';
   e.innerHTML=`<b>正解</b><br>${q.f.map((f,j)=>`${f.lb?esc(f.lb)+'：':''}<code>${esc(f.a[0])}</code>${f.a.length>1?`　<span style="color:#667;font-size:12.5px">（他に可: ${f.a.slice(1).map(x=>'<code>'+esc(x)+'</code>').join(' , ')}）</span>`:''}`).join('<br>')}
    <div style="margin-top:6px">${esc(q.e)}</div>`;
  } else if(q.ty==='code'){
   total++;
   e.className='exp show';
   const written=(document.getElementById('t'+i)||{}).value||'';
   e.innerHTML=`<b>模範解答</b><pre>${esc(q.m)}</pre>
    <b>採点ポイント（自己チェック — 満たせていれば1点）</b><ul class="chk">${q.pt.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <div style="margin-top:6px">${esc(q.e)}</div>
    ${written?'':'<div style="margin-top:6px;color:#a33">※ 未記入です。手を動かして書いてから見直してください。</div>'}`;
  } else {
   total++;
   const ok=sel[i]===q.a; if(ok)got++; else wrong.push(order.indexOf(i)+1);
   document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
    const o=+el.dataset.o; el.classList.remove('sel');
    if(o===q.a)el.classList.add('ok'); else if(o===sel[i])el.classList.add('no');
   });
   e.className='exp show';
   const ansTxt = q.ty==='ox' ? ['○','×'][q.a] : q.o[q.a];
   e.innerHTML=`<b>${ok?'✅ 正解':'❌ 不正解'}</b>　正解：${esc(ansTxt)}<br>${esc(q.e)}`;
  }
 });
 const codeN=Q.filter(q=>q.ty==='code').length;
 const auto=total-codeN;
 document.getElementById('score').textContent=`${got} / ${auto}`;
 const pct=Math.round(got/auto*100);
 const r=document.getElementById('res');r.className='res show';
 r.innerHTML=`<h3 style="margin:0 0 8px">自動採点 ${got} / ${auto}（${pct}%）＋ コード記述 ${codeN}問は自己採点</h3>
  <p style="margin:0">${pct>=90?'仕上がっています。あとはコード記述を実際に手で書けるか確認を。':pct>=70?'あと一息。間違えた問題のカテゴリだけ絞り込んで回してください。':'《期末试验复习笔记》の該当章を読んでから、もう一度どうぞ。'}</p>
  ${wrong.length?`<p style="margin:8px 0 0;color:#a33">間違えた問題：${wrong.sort((a,b)=>a-b).join('、')}（画面上の番号）</p>`:''}`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function revealAll(){Q.forEach((q,i)=>{if(q.ty==='code')showModel(i)});grade()}
function reset_(){sel={};revealed={};render();document.getElementById('res').className='res';document.getElementById('score').textContent='0 / 0';document.getElementById('prog').textContent='未採点';window.scrollTo({top:0,behavior:'smooth'})}
buildOrder();render();upd();syncBtn();
</script>
</body>
</html>
